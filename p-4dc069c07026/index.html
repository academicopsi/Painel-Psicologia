  .dp-mp{margin-top:-8px;}
  .mp-sim{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; margin-top:-2px; padding:10px 13px; border:0; border-radius:6px; cursor:pointer; color:#fff; background:linear-gradient(135deg, #2A1B3D 0%, #3B2357 100%);}
  .mp-sim:hover{filter:brightness(1.12);}
  .mp-sim-t{font-size:14px; font-weight:700;}
  .mp-sim-t small{display:block; font-size:12px; font-weight:500; opacity:.75; margin-top:1px;}
  .mp-sim-go{font-size:13.5px; font-weight:700; color:#FFD166; white-space:nowrap;}

  /* página da disciplina */
  .dp-header{padding:0 0 26px; margin:0 0 28px; border-bottom:1px solid var(--rule);}
  .dp-header .eyebrow{display:inline-flex; font-size:12.5px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); padding:5px 11px; border-radius:999px; margin-bottom:16px;}
  .dp-header h1{font-size:clamp(30px, 4.5vw, 44px); font-weight:800; letter-spacing:-0.035em; margin:0 0 10px;}
  .dp-header p{font-size:16px; color:var(--ink-soft); margin:0 0 18px;}
  .dp-actions{display:flex; flex-wrap:wrap; gap:10px;}
  .dp-progress{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-top:20px;}
  .dp-progress > div{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; display:grid; grid-template-columns:1fr auto; gap:6px;}
  .dp-progress span{font-size:13px; color:var(--ink-soft);}
  .dp-progress strong{font-size:15px;}
  .dp-bar{grid-column:1 / -1; height:6px; background:var(--paper-alt); border-radius:999px; overflow:hidden;}
  .dp-bar i{display:block; height:100%; background:var(--petrol); border-radius:999px;}
  .dp-section{margin:0 0 34px;}

  .rt-box{background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; scroll-margin-top:calc(var(--nav-h) + 16px);}
  .rt-sum{display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 12px; list-style:none; cursor:pointer; padding:16px 18px;}
  .rt-sum::-webkit-details-marker{display:none;}
  .rt-sum:hover{background:var(--paper-alt);}
  .rt-sum-t{font-size:16px; font-weight:800; letter-spacing:-0.01em; grid-column:1;}
  .rt-sum-s{font-size:13px; color:var(--ink-soft); grid-column:1;}
  .rt-sum-go{grid-column:2; grid-row:1 / span 2; font-size:13.5px; font-weight:700; color:var(--petrol); white-space:nowrap;}
  .rt-sum-go::after{content:" ↓";}
  .rt-box[open] > .rt-sum{border-bottom:1px solid var(--rule);}
  .rt-box[open] > .rt-sum .rt-sum-go{font-size:0;}
  .rt-box[open] > .rt-sum .rt-sum-go::after{content:"Fechar ↑"; font-size:13.5px;}
  .rt{display:flex; flex-direction:column; gap:10px; padding:12px; background:var(--paper-alt);}
  .rt .rt-q{margin-top:0;}
  .rt-head{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:16px 18px;}
  .rt-titulo{font-size:17px; font-weight:800; letter-spacing:-0.01em;}
  .rt-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .rt-intro{font-size:14.5px; line-height:1.55; margin:0 0 8px;}
  .rt-dicas{margin:0 0 10px; padding-left:20px; font-size:14px; line-height:1.5; color:var(--ink-soft);}
  .rt-dicas li{margin-bottom:4px;}
  .rt-q summary{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px;}
  .rt-qn{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--acc, var(--petrol));}
  .rt-qt{font-weight:700;}
  .rt-ok{font-size:12.5px; font-weight:700; color:var(--petrol);}
  .rt-ok:empty{display:none;}
  .rt-q.feita{border-color:var(--petrol-line);}
  .rt-body{padding:14px 18px 18px;}
  .rt-caso{font-size:14px; line-height:1.55; color:var(--ink-soft); background:var(--paper-alt); border-left:3px solid var(--acc, var(--petrol)); border-radius:0 8px 8px 0; padding:10px 12px; margin:0 0 6px;}
  #discPage h4.rt-h{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:18px 0 8px;}
  .rt-pede, .rt-pense{margin:0; padding-left:22px; font-size:14.5px; line-height:1.55;}
  .rt-pede li, .rt-pense li{margin-bottom:5px;}
  .rt-nota{font-size:13px; color:var(--ink-faint); margin:0 0 8px; line-height:1.45;}
  .rt-termos{display:flex; flex-wrap:wrap; gap:8px;}
  .rt-termo{display:inline-flex; align-items:stretch; border:1px solid var(--rule); border-radius:999px; overflow:hidden; background:var(--paper); font-size:13.5px;}
  .rt-termo a{padding:6px 12px; color:var(--ink); text-decoration:none;}
  .rt-termo a:hover{background:var(--paper-alt);}
  .rt-termo a.rt-scielo{border-left:1px solid var(--rule); color:var(--petrol); font-weight:700; font-size:12px; display:flex; align-items:center;}
  .rt-fontes{display:flex; flex-direction:column; gap:8px;}
  .rt-fonte{border:1px solid var(--rule); border-radius:6px; padding:10px 12px; background:var(--paper);}
  .rt-tipo{display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:3px;}
  .rt-ref{font-size:14px; font-weight:600; line-height:1.4;}
  .rt-ref a{color:var(--petrol);}
  .rt-onde{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-top:3px;}
  .rt-site{display:flex; flex-direction:column; gap:6px;}
  .rt-site-btn{text-align:left; font:inherit; font-size:14px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); border:none; border-radius:6px; padding:10px 12px; cursor:pointer;}
  .rt-confira{display:flex; flex-direction:column; gap:6px;}
  .rt-check{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.45; cursor:pointer; padding:8px 10px; border-radius:8px; background:var(--paper-alt);}
  .rt-check input{flex:none; width:18px; height:18px; margin:1px 0 0; accent-color:var(--petrol);}
  .rt-check input:checked + span{color:var(--ink-soft);}
  @media (max-width:600px){ .rt-body{padding:12px 13px 16px;} .rt-head{padding:14px;} }
  .dp-sec-links{display:flex; flex-wrap:wrap; gap:6px 16px;}
  .dp-sec-head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 12px; margin-bottom:12px;}
  .dp-sec-head h2{font-size:21px; font-weight:800; letter-spacing:-0.02em; margin:0;}
  .dp-count{font-size:13px; font-weight:600; color:var(--ink-faint);}
  .dp-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .dp-row{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:13px 16px; text-align:left; width:100%; color:var(--ink); font:inherit;}
  .dp-row.urgente{border-color:rgba(183,121,31,.5);}
  .dp-row-btn{cursor:pointer;}
  .dp-row-btn:hover{border-color:var(--petrol-line);}
  .dp-row-title{font-size:15px; font-weight:700; line-height:1.35;}
  .dp-row-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .dp-chip{flex:none; font-size:12.5px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .dp-row.urgente .dp-chip{color:var(--ochre); background:var(--ochre-soft);}
  .dp-go{flex:none; font-size:13.5px; font-weight:600; color:var(--petrol); white-space:nowrap;}
  .dp-empty{font-size:14px; color:var(--ink-faint); background:var(--paper); border:1px dashed var(--rule); border-radius:6px; padding:16px;}
  .dp-section .study-card{margin-bottom:10px;}
  .dp-videos{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
  .dp-video .dp-row-title{margin-top:8px; font-size:14px;}
  .dp-gl-list{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; padding:14px;}
  .dp-note{font-size:13.5px; color:var(--ink-faint);}
  @media (max-width:600px){
    .dp-gl-list{grid-template-columns:1fr; padding:10px;}
    .dp-row{padding:12px 13px;}
    .mp-grid{grid-template-columns:1fr;}
  }

  @media (max-width:600px){
    .brand-text small{display:none;}
    .nav-actions{gap:6px;}
    .nav-actions .icon-btn{width:36px; height:36px;}
    .brand-mark{width:34px; height:34px;}
  }
  @media (max-width:350px){ #shareBtn{display:none;} }

  .ord-list{display:flex; flex-direction:column; gap:8px;}
  .ord-item{display:flex; align-items:center; gap:12px; background:var(--paper-alt); border:1px solid var(--rule); border-radius:6px; padding:10px 12px;}
  .ord-item.ok{border-color:var(--petrol); background:var(--petrol-soft);}
  .ord-item.err{border-color:var(--danger); background:rgba(181,67,46,.07);}
  .ord-num{flex:none; width:26px; height:26px; border-radius:50%; background:var(--petrol); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  body.dark .ord-num{color:#0F1615;}
  .ord-txt{flex:1; font-size:14.5px; font-weight:600; line-height:1.4;}
  .ord-btns{flex:none; display:flex; gap:4px;}
  .ord-mv{width:36px; height:34px; border-radius:8px; border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft); cursor:pointer; font-size:12px;}
  .ord-mv:hover:not(:disabled){border-color:var(--petrol-line); color:var(--petrol);}
  .ord-mv:disabled{opacity:.35; cursor:default;}
  .ord-marca{font-style:normal; font-weight:700; color:var(--petrol); margin-left:4px;}

  /* ===== Resumos dentro do site ===== */
  .rs-header{padding:0 0 22px; margin:0 0 6px;}
  .rs-header .eyebrow{display:inline-flex; font-size:12.5px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); padding:5px 11px; border-radius:999px; margin-bottom:14px;}
  .rs-header h1{font-size:clamp(30px, 5vw, 44px); font-weight:800; letter-spacing:-0.035em; line-height:1.08; margin:0 0 12px;}
  .rs-header p{font-size:16.5px; color:var(--ink-soft); margin:0;}
  .rs-tabs{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 0;}
  .rs-tab{font:inherit; font-size:14px; font-weight:700; padding:10px 14px; border-radius:6px; border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;}
  .rs-tab small{font-size:11.5px; font-weight:600; color:var(--ink-faint);}
  .rs-tab:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .rs-tab.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .rs-tab.on small{color:rgba(255,255,255,.8);}
  body.dark .rs-tab.on{color:#0F1615;} body.dark .rs-tab.on small{color:rgba(15,22,21,.75);}
  .rs-progress{position:sticky; top:var(--nav-h); z-index:5; background:var(--bg); padding:12px 0 10px; margin:12px 0 4px;}
  .rs-progress-label{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .rs-bar{height:6px; background:var(--paper-alt); border-radius:999px; overflow:hidden;}
  .rs-bar i{display:block; height:100%; width:0; background:var(--petrol); border-radius:999px; transition:width .25s ease;}
  .rs-cap-title{font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:16px 0 6px;}
  .rs-cap-intro{font-size:15.5px; color:var(--ink-soft); margin:0 0 16px;}
  .rs-phase{font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); margin:32px 0 12px;}
  .rs-timeline{position:relative; padding-left:28px; margin-top:14px;}
  .rs-timeline::before{content:""; position:absolute; left:8px; top:8px; bottom:8px; width:2px; background:var(--petrol-line);}
  .rs-step{position:relative; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:18px 18px 16px; margin-bottom:14px; box-shadow:0 6px 18px var(--shadow);}
  .rs-step::before{content:""; position:absolute; left:-26px; top:22px; width:14px; height:14px; border-radius:50%; background:var(--paper); border:3px solid var(--petrol);}
  .rs-step.done::before{background:var(--petrol);}
  .rs-when{display:inline-block; font-size:12.5px; font-weight:700; color:var(--ochre); background:var(--ochre-soft); padding:3px 10px; border-radius:999px; margin-bottom:8px;}
  .rs-step h3{font-size:19px; font-weight:800; letter-spacing:-0.015em; margin:0 0 8px; line-height:1.3;}
  .rs-step ul{margin:0 0 4px; padding-left:20px;}
  .rs-step li{margin:4px 0; font-size:15.5px; line-height:1.6;}
  .rs-step li strong{color:var(--petrol);}
  .rs-test{margin-top:14px; border-top:1px dashed var(--rule); padding-top:12px;}
  .rs-test-q{font-size:14.5px; font-weight:700; margin-bottom:8px;}
  .rs-test-q span{font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--petrol); padding:2px 8px; border-radius:6px; margin-right:6px; vertical-align:1px;}
  body.dark .rs-test-q span{color:#0F1615;}
  .rs-reveal{font:inherit; font-size:13.5px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); border:1px solid var(--petrol-line); border-radius:9px; padding:7px 12px; cursor:pointer;}
  .rs-answer{display:none; margin-top:10px; background:var(--paper-alt); border-left:3px solid var(--petrol); border-radius:8px; padding:10px 12px; font-size:15px;}
  .rs-answer.show{display:block;}
  .rs-self{display:none; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--ink-soft);}
  .rs-self.show{display:flex;}
  .rs-self button{font:inherit; font-size:13px; font-weight:600; border-radius:8px; padding:6px 11px; cursor:pointer; border:1px solid var(--rule); background:var(--paper); color:var(--ink);}
  .rs-self button.on-ok{background:var(--petrol-soft); border-color:var(--petrol); color:var(--petrol);}
  .rs-self button.on-no{background:var(--ochre-soft); border-color:var(--ochre); color:var(--ochre);}
  .rs-table-wrap{overflow-x:auto;}
  .rs-table{width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--rule); border-radius:6px; overflow:hidden; font-size:15px;}
  .rs-table th, .rs-table td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--rule); vertical-align:top;}
  .rs-table th{background:var(--paper-alt); font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .rs-table tr:last-child td{border-bottom:none;}
  .rs-table td:first-child{font-weight:700;}
  .rs-box{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:18px; margin-bottom:12px;}
  .rs-box h3{margin:0 0 8px; font-size:17px;}
  .rs-box p{margin:0; font-size:15px; color:var(--ink-soft);}
  .rs-quiz-q{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:16px 18px; margin-bottom:12px;}
  .rs-quiz-q p{margin:0 0 10px; font-weight:700;}
  .rs-opt{display:block; width:100%; text-align:left; font:inherit; font-size:15px; background:var(--paper-alt); border:1px solid transparent; border-radius:6px; padding:10px 12px; margin-top:6px; cursor:pointer; color:var(--ink);}
  .rs-opt:hover{border-color:var(--petrol-line);}
  .rs-opt.ok{background:var(--petrol-soft); border-color:var(--petrol); font-weight:600;}
  .rs-opt.no{background:rgba(181,67,46,.09); border-color:var(--danger);}
  .rs-opt:disabled{cursor:default;}
  .rs-why{display:none; font-size:14px; color:var(--ink-soft); margin-top:10px;}
  .rs-why.show{display:block;}
  .rs-score{display:none; background:var(--petrol); color:#fff; border-radius:6px; padding:18px; font-size:17px; font-weight:700; text-align:center;}
  body.dark .rs-score{color:#0F1615;}
  .rs-score.show{display:block;}
  .rs-center{text-align:center;}
  .rs-again{font:inherit; font-size:14px; font-weight:600; margin-top:12px; padding:9px 16px; border-radius:6px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); cursor:pointer;}
  .rs-again[hidden]{display:none;}
  .rs-next{font:inherit; font-size:15px; font-weight:700; margin-top:24px; padding:12px 18px; border-radius:6px; border:none; background:var(--petrol); color:#fff; cursor:pointer;}
  body.dark .rs-next{color:#0F1615;}
  .rs-foot{margin-top:40px; padding-top:16px; border-top:1px solid var(--rule); font-size:13px; color:var(--ink-faint);}
  @media (max-width:600px){
    .rs-timeline{padding-left:22px;} .rs-step::before{left:-21px;} .rs-step{padding:16px 14px 14px;}
    .rs-tab{flex:1 1 30%; font-size:13px; padding:9px 10px;}
    .rs-table{font-size:14px;} .rs-table th, .rs-table td{padding:9px 10px;}
  }

  /* ===== Página da disciplina: blocos no mesmo formato (cards pequenos lado a lado) ===== */
  .dp-header{padding:0 0 22px; margin:0 0 26px;}
  .dp-header h1{margin-bottom:16px;}
  .dp-continue{display:grid; grid-template-columns:1fr auto; grid-template-areas:"lbl go" "t go" "s go"; align-items:center; column-gap:14px; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--petrol-soft); border:1px solid var(--petrol-line); border-left:4px solid var(--petrol); border-radius:6px; padding:12px 16px; margin:0 0 22px; cursor:pointer;}
  .dp-continue:hover{border-color:var(--petrol);}
  .dp-cont-lbl{grid-area:lbl; font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--petrol);}
  .dp-cont-t{grid-area:t; font-size:15.5px; font-weight:700; line-height:1.35; margin-top:2px;}
  .dp-cont-s{grid-area:s; font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .dp-cont-go{grid-area:go; font-size:14px; font-weight:700; color:var(--petrol); white-space:nowrap;}
  @media (max-width:600px){ .dp-continue{grid-template-columns:1fr; grid-template-areas:"lbl" "t" "s" "go";} .dp-cont-go{margin-top:8px;} }
  .dp-jump{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
  .dp-jump button{font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:7px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .dp-jump button span{font-size:12px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); border-radius:999px; padding:1px 7px;}
  .dp-jump button:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .dp-section{scroll-margin-top:calc(var(--nav-h) + 16px); margin:0 0 30px;}
  .dp-sec-head{align-items:center;}
  .dp-tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px;}
  .dp-tiles-prazo{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));}
  .dp-tile{position:relative; display:flex; flex-direction:column; gap:6px; text-align:left; font:inherit; color:var(--ink);
    background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:14px 15px; min-height:92px;
    transition:border-color .15s ease, box-shadow .15s ease;}
  button.dp-tile, .dp-tile-link{cursor:pointer;}
  button.dp-tile:hover, .dp-resumo:hover{border-color:var(--petrol-line); box-shadow:0 8px 20px var(--shadow);}
  .dp-tile.done{border-color:var(--petrol-line);}
  .dp-tile-title{font-size:15px; font-weight:700; line-height:1.35;}
  .dp-tile-sub{font-size:13px; color:var(--ink-soft); margin-top:auto;}
  .dp-ex .dp-tile-sub{color:var(--petrol); font-weight:600;}
  .dp-clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .dp-prazo{flex-direction:row; align-items:center; gap:12px; min-height:0;}
  .dp-date{flex:none; width:50px; text-align:center; background:var(--petrol-soft); color:var(--petrol); border-radius:6px; padding:7px 0 6px; line-height:1.05;}
  .dp-date b{display:block; font-size:20px; font-weight:800;}
  .dp-date span{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .dp-prazo.urgente .dp-date{background:var(--ochre-soft); color:var(--ochre);}
  .dp-prazo .dp-tile-body{min-width:0; display:flex; flex-direction:column; gap:3px;}
  .dp-prazo .dp-tile-sub{margin-top:0; font-weight:600; color:var(--petrol);}
  .dp-prazo.urgente .dp-tile-sub{color:var(--ochre);}
  .dp-resumo{padding:0; overflow:hidden;}
  .dp-tile-link{display:flex; flex-direction:column; gap:6px; padding:14px 15px 10px; color:inherit; text-decoration:none; flex:1;}
  .dp-tile-link .dp-tile-sub{color:var(--petrol); font-weight:600;}
  .dp-check{font:inherit; font-size:12.5px; font-weight:600; text-align:left; color:var(--ink-faint); background:var(--paper-alt); border:none; border-top:1px solid var(--rule); padding:8px 15px; cursor:pointer;}
  .dp-check:hover{color:var(--petrol);}
  .dp-resumo.done .dp-check{color:var(--petrol); background:var(--petrol-soft);}
  @media (max-width:600px){
    .dp-tiles{grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
    .dp-tiles-prazo{grid-template-columns:1fr;}
    .dp-tile{padding:12px; min-height:84px;}
    .dp-tile-link{padding:12px 12px 8px;}
    .dp-check{padding:7px 12px; font-size:12px;}
    .dp-tile-title{font-size:14px;}
    .dp-videos{grid-template-columns:1fr; gap:16px;} /* o player do YouTube não toca se tiver menos de 200 px de altura */
    .dp-video .dp-row-title{font-size:14px;}
  }

  /* ===== Ferramentas visuais ===== */
  .viz-box{padding:14px !important;}
  .viz-svg{width:100%; max-width:560px; display:block; margin:0 auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none;}
  .viz-axis{font-size:11px; font-weight:700; letter-spacing:.08em; fill:var(--ink-faint);}
  .viz-mk{cursor:pointer;}
  .viz-mk circle{fill:var(--paper); stroke:var(--ochre); stroke-width:2.5;}
  .viz-mk text{font-size:12px; font-weight:800; fill:var(--ink); pointer-events:none;}
  .viz-mk.sel circle{stroke:var(--petrol-dark); stroke-dasharray:3 2; stroke-width:3; fill:var(--petrol-soft);}
  .viz-mk.ok circle{fill:var(--petrol); stroke:var(--petrol);}
  .viz-mk.ok text{fill:#fff;}
  .viz-mk:focus{outline:none;} .viz-mk:focus-visible circle{stroke-width:4;}
  .viz-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; margin-top:10px; font-size:12px; color:var(--ink-soft);}
  .lg{display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:5px; border:2px solid var(--ochre); background:var(--paper);}
  .lg-sel{border:2px dashed var(--petrol-dark); background:var(--petrol-soft);} .lg-ok{background:var(--petrol); border-color:var(--petrol);}
  .viz-panel{margin-top:14px;}
  .viz-panel .plabel{font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;}
  .viz-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .viz-chip{font:inherit; font-size:14px; font-weight:600; padding:9px 13px; border-radius:6px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); cursor:pointer; text-align:left;}
  .viz-chip:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .viz-chip.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  body.dark .viz-chip.on{color:#0F1615;}
  .viz-chip.certo{border-color:var(--petrol); background:var(--petrol-soft); color:var(--petrol);}
  .viz-chip.errado{border-color:var(--danger); background:rgba(181,67,46,.08); color:var(--danger);}
  .viz-status{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; font-size:14px; font-weight:600; color:var(--petrol);}
  .viz-status .shuffle-btn{margin-top:0;}
  .viz-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px;}
  .viz-info{margin-top:12px; background:var(--paper-alt); border-left:3px solid var(--petrol); border-radius:8px; padding:11px 13px; font-size:14.5px; line-height:1.55;}
  .viz-muted{font-size:13.5px; color:var(--ink-faint);}

  /* corte da medula */
  .cm-branca{fill:#EFE9DC; stroke:#B9AE98; stroke-width:2;}
  .cm-cinza{fill:#9FB0AC; stroke:#6E817C; stroke-width:1.5;}
  .cm-septo{fill:none; stroke:#B9AE98; stroke-width:1.2; stroke-dasharray:3 3;}
  .cm-sulco{stroke:#8E8470; stroke-width:1.6;}
  .cm-fissura{fill:var(--bg); stroke:#B9AE98; stroke-width:1.5;}
  .cm-canal{fill:#fff; stroke:#6E817C; stroke-width:1.5;}
  .cm-root path{fill:none; stroke:#C9A15A; stroke-width:5; stroke-linecap:round;}
  .cm-ganglio{fill:#E3C68C; stroke:#B98F45; stroke-width:1.5;}
  .cm-radicula path{fill:none; stroke:#C9A15A; stroke-width:2; stroke-linecap:round;}
  .cm-comissura{fill:#9FB0AC;}
  .cm-leader{stroke:var(--ink-faint); stroke-width:1.5;}
  body.dark .cm-branca{fill:#D9D2C4;} body.dark .cm-fissura{fill:var(--bg);}

  /* meninges */
  .mn-wrap{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:18px; align-items:start;}
  .mn-stack{display:flex; flex-direction:column; gap:3px; background:var(--paper-alt); border-radius:6px; padding:10px;}
  .mn-agulha{font-size:12px; font-weight:700; color:var(--ink-faint); text-align:center; margin-bottom:4px;}
  .mn-slot{display:flex; align-items:center; gap:10px; font:inherit; font-size:14px; font-weight:700; text-align:left; border:none; border-radius:8px; padding:10px 12px; min-height:40px; color:#1F2A28; cursor:default;}
  .mn-slot span{flex:none; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.7); font-size:12px; display:flex; align-items:center; justify-content:center; color:#1F2A28;}
  .mn-slot.vazio{border:2px dashed var(--rule); background:transparent; color:var(--ink-faint);}
  .mn-slot.vazio span{background:var(--paper);}
  button.mn-slot[data-k]{cursor:pointer;}
  .mn-osso{background:repeating-linear-gradient(45deg,#E6DCC6,#E6DCC6 6px,#D8CBB0 6px,#D8CBB0 12px); min-height:48px;}
  .mn-epidural{background:#F6E7A8;}
  .mn-dura{background:#C98F7A; color:#fff; min-height:46px;} .mn-dura span{color:#1F2A28;}
  .mn-subdural{background:#F3E6E1; min-height:30px; font-size:13px;}
  .mn-aracnoide{background:radial-gradient(circle at 20% 50%, #fff 0 2px, transparent 3px) 0 0/14px 14px, #E8D9EE;}
  .mn-liquor{background:#BFE0F2; min-height:48px;}
  .mn-pia{background:#F2B8C6; min-height:30px; font-size:13px;}
  .mn-medula{background:#9FB0AC; min-height:54px;}
  .mn-slot.certo{box-shadow:inset 0 0 0 3px var(--petrol);}
  .mn-slot.errado{box-shadow:inset 0 0 0 3px var(--danger);}

  /* painel do SNA */
  .eb-range{width:100%; margin:12px 0 6px; accent-color:var(--petrol); height:28px;}
  .pa-desafio{margin-top:16px; background:var(--paper-alt); border-radius:6px; padding:14px;}
  .pa-desafio .plabel{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .pa-desafio .pfrase{font-size:15.5px; line-height:1.5;}

  /* esquema do SNA (fiel ao slide) */
  .sn-modos{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .sn-svg{max-width:560px; background:#fff; border-radius:6px;}
  .sn-encefalo{fill:#EAD2B2; stroke:#B88E5E; stroke-width:1.5;}
  .sn-cerebelo{fill:#E2C39C; stroke:#B88E5E; stroke-width:1;}
  .sn-medula{fill:#E9C99B; stroke:#B88E5E; stroke-width:1.2;}
  .sn-cadeia{stroke:#C9B04A; stroke-width:3;}
  .sn-ganglio{fill:#E8D57A; stroke:#A8902E; stroke-width:1;}
  .sn-seg{font-size:9.5px; font-weight:600; fill:#6B7A77;}
  .sn-seg.simp{fill:#2E8B3E;}
  .sn-lado{font-size:14px; font-weight:800;}
  .sn-lado.para, .sn-i.para{fill:#C62E40; color:#C62E40;}
  .sn-lado.simp, .sn-i.simp{fill:#2E8B3E; color:#2E8B3E;}
  .sn-i{font-weight:700;}
  .sn-fibra{fill:none; stroke-width:2; opacity:.9;}
  .sn-fibra.para{stroke:#D7263D;}
  .sn-fibra.simp{stroke:#2FA84F;}
  .sn-txt{font-size:11.5px; font-weight:600; fill:#22302E;}
  .sn-olho{fill:#fff; stroke:#7A6A62; stroke-width:1.2;}
  .sn-iris{fill:#5B8DB8;} .sn-pupila{fill:#111;}
  .sn-gland circle{fill:#E9C07F; stroke:#B88A3E; stroke-width:1;}
  .sn-pulmao{fill:#E9A0A6; stroke:#B5616B; stroke-width:1.2;}
  .sn-bronq{fill:none; stroke:#8C3B45; stroke-linecap:round;}
  .sn-cor{fill:#C62E40; stroke:#8C1E2C; stroke-width:1.2;}
  .sn-figado{fill:#A8553A; stroke:#7A3A26; stroke-width:1.2;}
  .sn-estomago{fill:#EBB0A3; stroke:#B9786A; stroke-width:1.2;}
  .sn-rim{fill:#B5545C; stroke:#7E333A; stroke-width:1.2;} .sn-supra{fill:#F0C24E; stroke:#B08A22; stroke-width:1;}
  .sn-intest{fill:#EBB79C; stroke:#B07B5F; stroke-width:1.4;}
  .sn-bexiga{fill:#F0C9A5; stroke:#B98A62; stroke-width:1.2;}
  .sn-org{cursor:pointer;} .sn-efeito{cursor:pointer;}
  .sn-org:focus{outline:none;} .sn-org:focus-visible{outline:2px solid var(--petrol);}
  .sn-org.sn-on{filter:drop-shadow(0 0 5px #F08A24);}
  .sn-fibra.sn-on{stroke-width:4; opacity:1;}
  .sn-esconde, .sn-q{display:none;}
  .sn-esconde{fill:#EEF2F1; stroke:#C9D3D1;} .sn-q{font-size:16px; font-weight:800; fill:#6B7A77;}
  .modo-estudo .sn-efeito:not(.revelado) .sn-txt{display:none;}
  .modo-estudo .sn-efeito:not(.revelado) .sn-esconde, .modo-estudo .sn-efeito:not(.revelado) .sn-q{display:inline;}
  .modo-para .simp:not(.sn-lado), .modo-simp .para:not(.sn-lado){opacity:.12;}
  .modo-para .sn-ganglio, .modo-para .sn-cadeia{opacity:.25;}

  /* embrião */
  .eb-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .eb-top strong{font-size:20px; font-weight:800; color:var(--petrol);}
  .eb-top span{font-size:14px; font-weight:600; color:var(--ink-soft);}
  .eb-ticks{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); padding:0 4px;}
  .eb-nomes{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft); margin-top:8px;}
  .eb-nomes input{accent-color:var(--petrol);}
  #ebSvg [data-est]{cursor:pointer; transition:filter .15s ease;}
  #ebSvg .eb-on{filter:drop-shadow(0 0 4px #F08A24) brightness(1.06);}
  .eb-zona{fill:none; stroke:#D9CFE8; stroke-width:12;}
  .eb-zona.some{stroke-dasharray:8 8; opacity:.55;}
  .eb-cito{fill:#F6E3D3; stroke:#C9A88E; stroke-width:1.5;}
  .eb-nucleo{fill:#B78BB0; stroke:#7E5677; stroke-width:1.5;}
  .eb-polar{fill:#E7CFE0; stroke:#9E7C96; stroke-width:1;}
  .eb-cel{fill:#F3D9C4; stroke:#B98F72; stroke-width:1.5;}
  .eb-cavidade{fill:#DDEFF7; stroke:none;}
  .eb-trofo{fill:none; stroke:#D8A25E; stroke-width:8;}
  .eb-embrio{fill:#C77D8E; stroke:#8E4B5B; stroke-width:1.2;}
  .eb-endo{fill:#F3E6D3; stroke:#D8C3A5; stroke-width:1.2;}
  .eb-glandula circle{fill:none; stroke:#A0522D; stroke-width:3;} .eb-glandula circle+circle{stroke-width:1.5; fill:#F8EFE2;}
  .eb-vaso{fill:#E36464;}
  .eb-sincicio{fill:#3FBF4D; stroke:#24873A; stroke-width:1.5;}
  .eb-sinc-nuc{fill:#1F6B32;}
  .eb-lacuna{fill:#F6EEC4; stroke:#C9BB7A; stroke-width:1;}
  .eb-lacuna.sangue{fill:#E05A5A; stroke:#A8323A;}
  .eb-citoring{fill:none; stroke:#2C8A3E; stroke-width:7;}
  .eb-cito-cel circle{fill:#14502A;}
  .eb-cav{fill:#FFFFFF; stroke:none;}
  .eb-heuser{fill:none; stroke:#7A7F86; stroke-width:2.5; stroke-dasharray:5 3;}
  .eb-meso{fill:#F4C6CB; stroke:#D98F98; stroke-width:1.2; stroke-dasharray:2 3;}
  .eb-pedic{fill:#E9A3AC;}
  .eb-amnio{fill:none; stroke:#5F6B69; stroke-width:2.5;}
  .eb-svs{fill:#FFFFFF; stroke:#8A9095; stroke-width:2.5;}
  .eb-cisto{fill:#FFFFFF; stroke:#8A9095; stroke-width:2; stroke-dasharray:4 3;}
  .eb-epi{fill:#9AA1A6; stroke:#4F575C; stroke-width:1.2;}
  .eb-epi-cel{stroke:#4F575C; stroke-width:1; fill:none;}
  .eb-hipo{fill:#D7DEE3; stroke:#6E777D; stroke-width:1.2;}

  .eb-rot text{font-size:11px; font-weight:700; fill:#33403E; paint-order:stroke; stroke:#ffffffcc; stroke-width:3px;}
  .eb-hcg{font-size:10.5px; font-weight:700; fill:#B07432;}

  /* ZDP */
  .zd-banco{min-height:44px; padding:10px; border:1px dashed var(--rule); border-radius:6px; margin-bottom:12px;}
  .zd-zonas{margin-top:4px;}

  .zd-zona.alvo{box-shadow:0 0 0 2px var(--petrol-line);}
  .zd-z3{background:var(--paper-alt); border:1px solid var(--rule);}
  .zd-z2{background:var(--ochre-soft); border:2px solid rgba(183,121,31,.45); margin-top:8px;}
  .zd-z1{background:var(--petrol-soft); border:2px solid var(--petrol-line); margin-top:8px;}
  .zd-zt{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 8px 2px;}
  .zd-z2 > .zd-zt{color:var(--ochre);} .zd-z1 > .zd-zt{color:var(--petrol);}

  @media (max-width:600px){
    .mn-wrap, .pa-wrap{grid-template-columns:1fr;}

    .viz-chip{font-size:13.5px; padding:8px 11px;}

    .viz-axis{font-size:13px;}
  }

  /* =========================================================
     V3 · paleta areia/sálvia, títulos serifados, cards por matéria
     ========================================================= */
  :root{
    --bg:#F6F2EA;
    --paper:#FFFDF8;
    --paper-alt:#F0EADF;
    --ink:#1B2422;
    --ink-soft:#5C6560;
    --ink-faint:#8D938B;
    --petrol:#1F5C56;
    --petrol-dark:#163F3B;
    --petrol-soft:#E2EAE0;
    --petrol-line:#C3D1C0;
    --sage:#A9BBA4;
    --sand:#E8DCC6;
    --rule:#E5DDCE;
    --shadow: rgba(40,36,26,0.06);
    --shadow-lg: rgba(40,36,26,0.10);
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  }
  body.dark{ --sage:#5E7A6E; --sand:#3A3428; }
  .site-nav::before{background:rgba(250,246,238,0.88);}
  body.dark .site-nav::before{background:rgba(15,22,21,0.88);}

  /* títulos serifados */
  h1, .hero h1, .section-title h2, .drive-block .section-title h2, .dp-header h1, .rs-header h1,
  .wrap:not(#top) > header h1, .cine-title, .arena-title, .tool-group-title, .dp-sec-head h2,
  .cta-band h3, .brand-text strong, .card .name, .rs-cap-title, .ex-title{
    font-family:var(--serif); font-optical-sizing:auto; letter-spacing:-0.01em;
  }
  h1, .hero h1, .dp-header h1, .rs-header h1, .wrap:not(#top) > header h1{font-weight:600; letter-spacing:-0.02em;}
  .section-title h2, .drive-block .section-title h2, .tool-group-title, .dp-sec-head h2, .cta-band h3{font-weight:600;}
  .hero h1 .hl{font-style:italic; font-weight:500;}
  .brand-text strong{font-weight:600; font-size:17px;}

  /* cards das disciplinas: número e cor por matéria, sem ícones */
  [data-d="01"]{--acc:#6F8F6B;}
  [data-d="02"]{--acc:#2E6B64;}
  [data-d="03"]{--acc:#B8734F;}
  [data-d="04"]{--acc:#A8873A;}
  [data-d="05"]{--acc:#86697F;}
  [data-d="06"]{--acc:#5C7A8F;}
  [data-d="07"]{--acc:#7E7A5A;}
  .drive-block .card{background:var(--paper); border:1px solid var(--rule); border-top:3px solid var(--acc, var(--petrol)); border-radius:6px;}
  .drive-block .card:hover{border-color:var(--rule); border-top-color:var(--acc, var(--petrol)); box-shadow:0 14px 30px var(--shadow-lg);}
  .card .idx{font-family:var(--serif); font-size:22px; font-weight:500; line-height:1; color:var(--acc, var(--petrol)); background:none; padding:0; letter-spacing:0;}
  .drive-block .card .name{font-weight:600; font-size:19px; line-height:1.2;}
  .card .drive-tag{opacity:.75;}
  .card-drive{background:var(--petrol); border-color:var(--petrol);}
  .card-disc{background:transparent; border-color:var(--rule); color:var(--ink);}
  .card-disc:hover{background:var(--paper-alt); border-color:var(--acc, var(--petrol-line)); color:var(--ink);}
  .dp-header{border-left:3px solid var(--acc, var(--petrol)); padding-left:18px;}
  @media (max-width:600px){
    .card .idx{font-size:18px;}
    .drive-block .card .name{font-size:16px;}
  }

  /* página da disciplina: cada seção como um bloco próprio, discreto */
  #discPage .dp-section{background:var(--paper-alt); border:1px solid var(--rule); border-radius:6px; padding:22px 22px 24px; margin:0 0 18px;}
  #discPage .dp-sec-head{margin-bottom:16px;}
  #discPage .dp-sec-head h2{display:flex; align-items:center; gap:10px;}
  #discPage .dp-sec-head h2::before{content:""; width:4px; height:1.05em; border-radius:2px; background:var(--acc, var(--petrol)); flex:none;}
  #discPage .dp-tile{background:var(--paper);}
  #discPage .dp-video .video-frame{border-radius:6px; overflow:hidden;}
  #discPage #dpGlossario{background:none; border:none; padding:0;}
  #discPage details.dp-gl, #discPage .dp-section details{background:var(--paper);}
  body.dark #discPage .dp-section{background:var(--paper);}
  body.dark #discPage .dp-tile{background:var(--paper-alt);}
  @media (max-width:600px){ #discPage .dp-section{padding:16px 14px 18px; border-radius:6px; margin-bottom:14px;} }
  .brand-logo{display:block; object-fit:cover; background:#1E3A2F; padding:0;}

  /* resumo: perguntas do Teste-se reunidas no fim */
  .rs-rev-intro{font-size:14px; color:var(--ink-soft); margin:-4px 0 12px;}
  .rs-rev{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:14px 16px; margin-bottom:10px;}
  .rs-rev.done{border-color:var(--petrol-line);}
  .rs-rev .rs-test-q span{background:var(--paper-alt); color:var(--ink-soft); min-width:24px; text-align:center;}
  .rs-rev.done .rs-test-q span{background:var(--petrol); color:#fff;}

  /* celular: topo como banner + resumo do semestre compacto */
  .lead .so-mob{display:none;}
  @media (max-width:600px){
    #top{padding-top:16px;}
    .hero{gap:12px; padding-bottom:28px;}
    .hero-text{background:var(--petrol-dark); color:#fff; border-radius:6px; padding:24px 20px 18px; position:relative; overflow:hidden;}
    .hero-text::after{content:""; position:absolute; right:-70px; top:-70px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); pointer-events:none;}
    body.dark .hero-text{background:#183634;}
    .hero h1{color:#fff; font-size:30px; margin:0 0 10px;}
    .hero h1 .hl{color:#CFE3C9;}
    .lead{color:rgba(255,255,255,.82); font-size:15.5px; margin:0 0 18px;}
    .lead .so-desk{display:none;} .lead .so-mob{display:inline;}
    .hero-ctas{gap:8px;}
    .hero-ctas .btn{padding:11px 14px;}
    .hero-ctas .btn-primary{background:#fff; color:var(--petrol-dark);}
    .hero-ctas .btn-accent{background:rgba(255,255,255,.10); color:#fff; border-color:rgba(255,255,255,.28);}
    body.dark .hero-ctas .btn-primary{color:#183634;}
    .hero-search{margin-top:10px; background:rgba(255,255,255,.96); border-color:transparent;}
    .hero-meta{margin-top:14px; color:rgba(255,255,255,.62); font-size:12.5px; gap:4px 12px;}
    .hero-meta .live::before{box-shadow:0 0 0 3px rgba(47,163,107,.3);}
    .hero-panel{display:grid; grid-template-columns:1fr 1fr; gap:0; padding:0; border-radius:6px; box-shadow:0 8px 22px var(--shadow);}
    .hero-panel > div:not(.panel-divider){padding:14px 14px 14px;}
    .hero-panel .panel-divider{display:none;}
    .hero-panel > div:last-child{border-left:1px solid var(--rule);}
    .panel-label{font-size:10.5px; margin-bottom:6px;}
    .progress-block .label{flex-direction:column; align-items:flex-start; gap:2px; font-size:12.5px; margin-bottom:8px;}
    .progress-block .label strong{font-size:14.5px;}
    .top-deadline{gap:4px;}
    .top-deadline .alert-badge{display:none;}
    .top-deadline .txt{font-size:13.5px; line-height:1.4;}
    .deadline-more-link{margin-top:4px; font-size:12.5px;}
  }
  @media (max-width:600px){
    .hero-search span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
    .panel-label{letter-spacing:.03em;}
  }

  /* página da disciplina: botões com tamanho padrão */
  .dp-jump{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; max-width:720px;}
  .dp-jump button{justify-content:space-between; width:100%; padding:9px 12px; border-radius:6px;}
  .dp-actions .btn{min-width:200px;}
  @media (max-width:600px){
    .dp-jump{grid-template-columns:repeat(2, minmax(0,1fr));}
    .dp-jump button:last-child:nth-child(odd){grid-column:1 / -1;}
    .dp-actions .btn{width:100%; min-width:0;}
  }
  .drive-block .card-actions{display:grid; grid-template-columns:1fr; gap:8px;}
  .drive-block .card-drive, .drive-block .card-disc{width:100%;}

  /* créditos */
  .hero-meta .hero-credito{flex-basis:100%; font-size:13.5px; color:var(--ink-soft);}
  .hero-meta .hero-credito strong{color:var(--ink); font-weight:600;}
  @media (max-width:600px){ .hero-meta .hero-credito{color:rgba(255,255,255,.80);} .hero-meta .hero-credito strong{color:#fff;} }
  .foot-autor{color:var(--ink-soft); font-weight:600;}
  .sobre-autor{background:var(--paper-alt); border:1px solid var(--rule); border-left:3px solid var(--petrol); border-radius:6px; padding:20px 22px; margin:0 0 26px;}
  .sobre-autor p{margin:0 0 10px;}
  .sobre-assinatura{font-family:var(--serif); font-style:italic; font-size:17px; color:var(--petrol); margin:4px 0 0 !important;}

  /* exemplos no glossário */
  .gl-ex{margin:6px 0 0 !important; font-size:13.5px !important; font-style:italic; color:var(--ink-soft);}
  .gl-ex b{font-style:normal; color:var(--petrol); font-weight:600;}
  /* barra de letras */
  .gl-letras{display:flex; gap:4px; overflow-x:auto; padding:2px 0 6px; margin:8px 0 2px; scrollbar-width:none;}
  .gl-letras::-webkit-scrollbar{display:none;}
  .gl-letras button{flex:none; width:32px; height:32px; border-radius:8px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); font:inherit; font-size:13px; font-weight:700; cursor:pointer;}
  .gl-letras button:hover{border-color:var(--petrol); color:var(--petrol);}
  .gl-list{position:relative;}
  /* comparações */
  .cmp-grupo{margin:0 0 18px;}
  .cmp-disc{font-family:var(--serif); font-size:17px; font-weight:600; margin:0 0 8px; color:var(--ink);}
  .cmp-item{margin-bottom:8px;}
  .cmp-wrap{overflow-x:auto; margin:10px 0 4px;}
  .cmp-table{width:100%; border-collapse:collapse; font-size:14px; line-height:1.45;}
  .cmp-table th, .cmp-table td{text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--rule);}
  .cmp-table thead th{font-size:13px; color:var(--petrol); font-weight:700; background:var(--petrol-soft);}
  .cmp-table tbody th{font-weight:600; color:var(--ink-soft); width:28%;}
  /* página da disciplina: busca e comparações no bloco do glossário */
  .dp-gl-busca{width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--paper-alt); color:var(--ink); margin:12px 0 10px;}
  .dp-gl-vazio{font-size:14px; color:var(--ink-faint); padding:6px 2px;}
  #dpGlossario .cmp-item{margin-top:10px;}
  .dp-actions .btn-pdf{background:var(--paper); color:var(--ink); border-color:var(--rule);}
  .dp-actions .btn-pdf:hover{border-color:var(--petrol-line); color:var(--petrol);}
  /* resumão em PDF */
  #printArea{display:none;}
  @media print{
    @page{margin:16mm 14mm;}
    body.imprimindo{padding:0 !important; background:#fff !important;}
    body.imprimindo > *:not(#printArea){display:none !important;}
    .pr-barra{display:none !important;}
  }
  /* resumão aberto como página (app instalado no iPhone) */
  body.resumao-tela{padding:0 !important; background:#fff;}
  body.resumao-tela > *:not(#printArea){display:none !important;}
  body.resumao-tela #printArea{max-width:780px; margin:0 auto; padding:16px 18px 40px;}
  .pr-barra{display:flex; gap:8px; flex-wrap:wrap; align-items:center; position:sticky; top:0; background:#fff; padding:10px 0 12px; border-bottom:1px solid #e5e5e5; margin-bottom:14px; z-index:2;}
  .pr-barra p{flex-basis:100%; margin:0; font-size:13px; color:#666;}
  body.imprimindo #printArea, body.resumao-tela #printArea{display:block; color:#111; background:#fff; font-family:'Inter', system-ui, sans-serif; font-size:11pt; line-height:1.5;}
  @media all{
    #printArea h1{font-family:var(--serif); font-size:24pt; margin:4px 0 4px; color:#163F3B;}
    #printArea h2{font-family:var(--serif); font-size:15pt; margin:18px 0 8px; color:#163F3B; border-bottom:1.5px solid #C3D1C0; padding-bottom:3px; break-after:avoid;}
    #printArea h3{font-size:12pt; margin:12px 0 6px; break-after:avoid;}
    #printArea h4{font-size:11pt; margin:10px 0 4px; break-after:avoid;}
    #printArea ul, #printArea ol{margin:4px 0 8px; padding-left:18px;}
    #printArea li{margin-bottom:3px;}
    .pr-marca{font-size:9pt; letter-spacing:.08em; text-transform:uppercase; color:#1F5C56; font-weight:700;}
    .pr-head p{font-size:9pt; color:#555; margin:0 0 10px;}
    .pr-etapa{break-inside:avoid;}
    .pr-teste{background:#F4F1EA; border-radius:6px; padding:6px 10px 2px; margin:8px 0 12px; break-inside:avoid-page;}
    .pr-resp{color:#1F5C56;}
    .pr-nota{font-size:9pt; color:#666;}
    .pr-gl dt{font-weight:700; margin-top:6px; break-after:avoid;}
    .pr-gl dd{margin:0 0 4px 0;}
    #printArea .cmp-table{font-size:10pt; break-inside:avoid;}
    #printArea .cmp-table th, #printArea .cmp-table td{border-bottom:1px solid #ddd; padding:4px 6px;}
    #printArea .cmp-table thead th{background:#EEF3EC; color:#163F3B;}
    .pr-foot{margin-top:20px; font-size:8.5pt; color:#777; border-top:1px solid #ddd; padding-top:6px;}
    #printArea a{color:inherit; text-decoration:none;}
  }
  .dp-gl-sub{font-size:14px; color:var(--ink-soft); line-height:1.35;}
  #dpGlossario .dp-gloss > summary{display:flex; align-items:center; gap:10px;}
  #dpGlossario .dp-gloss > summary .dp-gl-sub{flex:1; min-width:0;}
  .dp-gl-busca{display:block; width:calc(100% - 28px) !important; margin:14px 14px 4px !important; background:var(--paper) !important;}
  .dp-cmp-list{display:flex; flex-direction:column; gap:8px; padding:14px;}
  #dpGlossario .dp-cmp-list .cmp-item{margin:0; border:1px solid var(--rule); border-radius:6px; background:var(--paper); box-shadow:none;}
  #dpGlossario .dp-cmp-list .cmp-item > summary{font-size:15px; font-weight:600; padding:13px 14px;}
  #dpGlossario .dp-cmp-list .cmp-item[open] > summary{background:var(--paper-alt);}
  #dpGlossario .dp-cmp-list .cmp-wrap{padding:10px;}
  @media (max-width:600px){ .dp-gl-busca{width:calc(100% - 20px) !important; margin:10px 10px 2px !important;} .dp-cmp-list{padding:10px;} }
  @media print{ .pr-teste{break-inside:auto;} }
  .nota-fora{font-size:12px; font-weight:500; color:var(--ink-faint); margin-top:2px;}
  .study-subtitle .nota-fora{display:inline;}

  /* página Sobre */
  #viewSobre h4.sobre-h{font-family:var(--serif) !important; font-size:20px !important; font-weight:600; margin:30px 0 12px;}
  .sobre-mapa{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .sobre-item{display:flex; flex-direction:column; gap:4px; text-align:left; font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:14px 16px; cursor:pointer;}
  .sobre-item:hover{border-color:var(--petrol-line);}
  .sobre-item strong{font-size:15px; color:var(--petrol);}
  .sobre-item span{font-size:13.5px; line-height:1.5; color:var(--ink-soft);}
  .sobre-avisos ul{margin:8px 0 0; padding-left:18px;}
  .sobre-avisos li{margin-bottom:4px;}
  .sobre-numeros{margin-top:30px;}
  .sobre-numeros .stats-strip{grid-template-columns:repeat(6, minmax(0,1fr));}
  @media (max-width:600px){ .sobre-mapa{grid-template-columns:1fr;} .sobre-numeros .stats-strip{grid-template-columns:repeat(3, minmax(0,1fr));} }

  /* janela de escolha do resumão em PDF */
  body.pdfo-aberta{overflow:hidden;}
  .pdfo-fundo{position:fixed; inset:0; z-index:300; background:rgba(20,28,26,.45); display:flex; align-items:center; justify-content:center; padding:16px;}
  .pdfo{width:100%; max-width:440px; max-height:calc(100vh - 32px); display:flex; flex-direction:column; background:var(--paper); border-radius:6px; box-shadow:0 24px 60px rgba(0,0,0,.25); overflow:hidden;}
  .pdfo-top{display:flex; align-items:baseline; gap:8px; padding:16px 18px 12px; border-bottom:1px solid var(--rule);}
  .pdfo-top strong{font-family:var(--serif); font-size:19px; font-weight:600;}
  .pdfo-top span{font-size:13px; color:var(--ink-soft); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pdfo-x{border:none; background:none; font-size:24px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:0 2px;}
  .pdfo-corpo{overflow-y:auto; padding:8px 18px 4px;}
  .pdfo-grupo{padding:8px 0 10px;}
  .pdfo-grupo + .pdfo-grupo{border-top:1px solid var(--rule);}
  .pdfo-tit{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin:6px 0 4px;}
  .pdfo-item{display:flex; align-items:flex-start; gap:10px; padding:8px 0; font-size:15px; cursor:pointer;}
  .pdfo-item input{width:18px; height:18px; margin:2px 0 0; accent-color:var(--petrol); flex:none;}
  .pdfo-item small{font-size:12.5px; color:var(--ink-faint);}
  .pdfo-pe{padding:12px 18px 16px; border-top:1px solid var(--rule);}
  .pdfo-pe .btn{width:100%;}
  .pdfo-aviso{margin:0 0 8px; font-size:13px; color:var(--danger);}
  @media (max-width:600px){ .pdfo-fundo{align-items:flex-end; padding:0;} .pdfo{max-width:none; border-radius:6px 18px 0 0; max-height:88vh;} .pdfo-pe{padding-bottom:calc(16px + env(safe-area-inset-bottom));} }

  /* =========================================================
     V4 · meio termo: papel pontilhado, cartões tingidos,
     detalhes em monoespaçada, títulos em Lora, cantos retos
     ========================================================= */
  :root{
    --serif:'Lora', Georgia, 'Times New Roman', serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --bg:#EFEAE0;
    --paper:#F8F4EB;
    --paper-alt:#E9E2D4;
    --rule:#D8CEBB;
    --ink:#22262B;
    --ink-soft:#5B584E;
    --ink-faint:#8A857A;
    --radius:6px;
    --radius-sm:4px;
  }
  body{
    background-color:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(34,38,43,0.07) 1px, transparent 0);
    background-size:22px 22px;
  }
  body.dark{ background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0); }
  .site-nav::before{background:rgba(239,234,224,0.92);}

  /* títulos */
  h1, .hero h1, .dp-header h1, .rs-header h1, .wrap:not(#top) > header h1{font-weight:600; letter-spacing:-0.01em;}
  .hero h1 .hl{font-weight:500;}

  /* detalhes em monoespaçada (nunca em parágrafos) */
  .eyebrow, .panel-label, .section-title .num, .section-title .count, .dp-count,
  .nota-fora, .tool-disclaimer, .stats-nota, .wrap > footer, .back-link, .card .idx, .tabs .tab,
  .tool-tipo, .rt-tipo, .rt-qn, .rt-ok, .dp-cont-lbl, .live,
  .card-drive, .card-disc, .drive-all, .dp-sec-links .link-btn, .rt-sum-go, .dp-date span,
  .stat-label, .quick-card .qc-go, .hero-credito{
    font-family:var(--mono) !important; letter-spacing:0.01em;
  }
  .eyebrow, .panel-label, .section-title .num{font-weight:500; letter-spacing:0.06em;}
  .card .idx{font-size:15px !important; font-weight:500; letter-spacing:0.04em;}
  .card-drive, .card-disc{font-size:12px; font-weight:500; white-space:nowrap; letter-spacing:0 !important;}
  .tool-disclaimer, .stats-nota, .wrap > footer{font-size:12px;}

  /* seções do início numeradas (01, 02…) */
  main#top{counter-reset:secao;}
  #top .section-title h2::before{
    counter-increment:secao; content:counter(secao, decimal-leading-zero);
    font-family:var(--mono); font-size:0.55em; font-weight:500; color:var(--ochre);
    margin-right:12px; vertical-align:0.25em; letter-spacing:0.02em;
  }

  /* traço firme abaixo do título das páginas */
  .wrap:not(#top) > header{border-bottom:2px solid var(--ink); padding-bottom:20px; margin-bottom:28px;}
  .dp-header{border-bottom:2px solid var(--ink); padding-bottom:20px;}

  /* cartões tingidos, sem sombra flutuante */
  .drive-block .card{
    background:color-mix(in srgb, var(--acc, var(--petrol)) 8%, var(--paper));
    border:1px solid var(--rule); border-top:3px solid var(--acc, var(--petrol)); box-shadow:none;
  }
  .drive-block .card:hover{box-shadow:0 6px 16px var(--shadow);}
  .card-disc{background:transparent;}
  .quick-card{background:color-mix(in srgb, var(--sage, #A9BBA4) 16%, var(--paper)); border-color:var(--rule); box-shadow:none;}
  .quick-card.qc-feature{background:var(--petrol);}
  #discPage .dp-tile, .rt-head, .rt-fonte{background:var(--paper);}
  #discPage .dp-section{background:color-mix(in srgb, var(--sand, #E8DCC6) 30%, var(--paper));}
  .graveyard, .rt-box, .tool-card, .study-card{box-shadow:none;}
  .hero-panel{box-shadow:none;}


  /* links do cabeçalho das seções como botões pequenos e separados */
  .dp-sec-links{gap:8px !important;}
  .dp-sec-links .link-btn{display:inline-flex; align-items:center; border:1px solid var(--rule); border-radius:4px; padding:6px 11px; background:var(--paper); text-decoration:none !important; font-size:12px; color:var(--petrol);}
  .dp-sec-links .link-btn:hover{border-color:var(--petrol-line); background:var(--petrol-soft);}

  /* modo escuro: tingimento mais discreto */
  body.dark .drive-block .card{background:color-mix(in srgb, var(--acc, var(--petrol)) 10%, var(--paper));}
  body.dark .quick-card{background:var(--paper);}
  body.dark .quick-card.qc-feature{background:var(--petrol-dark);}
  body.dark #discPage .dp-section{background:var(--paper);}
  body.dark .wrap:not(#top) > header, body.dark .dp-header{border-bottom-color:var(--ink-soft);}

  /* Revisão dos erros */
  .er-filtros{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .er-chip{font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:7px 13px; cursor:pointer;}
  .er-chip span{font-family:var(--mono, monospace); font-size:12px; color:var(--ink-faint); margin-left:4px;}
  .er-chip.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .er-chip.on span{color:rgba(255,255,255,.8);}
  .er-topo{display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px; margin-bottom:18px;}
  .er-lista{display:flex; flex-direction:column; gap:8px;}
  .er-item, .er-card, .er-vazio, .er-fim{background:var(--paper); border:1px solid var(--rule); border-left:3px solid var(--acc, var(--petrol)); border-radius:6px; padding:14px 16px;}
  .er-vazio, .er-fim{border-left-color:var(--petrol);}
  .er-vazio p, .er-fim p{color:var(--ink-soft); margin:6px 0 14px;}
  .er-acoes{display:flex; flex-wrap:wrap; gap:8px;}
  .er-meta{font-family:var(--mono, monospace); font-size:11.5px; color:var(--ink-faint); letter-spacing:.02em; margin-bottom:6px;}
  .er-q{font-size:15px; line-height:1.5; font-weight:600;}
  .er-n{font-size:12.5px; color:var(--danger); margin-top:6px;}
  .er-card{padding:18px;}
  .er-card .er-q{font-size:16px; margin-bottom:6px;}
  .er-prog{display:flex; justify-content:space-between; align-items:center; font-family:var(--mono, monospace); font-size:12px; color:var(--ink-soft); margin-bottom:12px;}
  .er-why{margin-top:14px; padding:12px 14px; border-radius:6px; font-size:14px; line-height:1.5;}
  .er-why p{margin:6px 0 0; color:var(--ink-soft);}
  .er-why.good{background:var(--petrol-soft);}
  .er-why.bad{background:rgba(181,67,46,.08);}
  .er-prox{margin-top:14px;}
  .er-aviso{border-left-color:var(--danger) !important;}

  /* Projeto de Extensão: montador do relatório */
  .mt-txt{display:block; width:100%; margin-top:14px; font:inherit; font-size:15px; line-height:1.55; padding:12px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink); resize:vertical;}
  .mt-txt:focus, .mt-capa input:focus, .mt-capa textarea:focus, .mt-construtor input:focus{outline:2px solid var(--petrol-line); border-color:var(--petrol);}
  .mt-checks{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:13.5px; line-height:1.45;}
  .mt-checks li{padding:6px 10px; border-radius:6px;}
  .mt-ok{background:var(--petrol-soft); color:var(--petrol-dark);}
  .mt-aviso{background:var(--ochre-soft, #FBF1E1); color:#7a4f12;}
  body.dark .mt-aviso{color:#E0A94A;}
  .mt-capa{display:flex; flex-direction:column; gap:10px;}
  .mt-capa label{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; color:var(--ink-soft);}

  .sim-jogo{max-width:820px; margin:0 auto; padding:26px 16px 140px; display:flex; flex-direction:column; gap:22px;}

  .sim-ops{display:grid; grid-template-columns:1fr; gap:10px;}

  .sim-op.c0{background:#2F6DB5;} .sim-op.c1{background:#1F9C8F;} .sim-op.c2{background:#D99417;} .sim-op.c3{background:#D04A68;} .sim-op.c4{background:#8E44AD;}

  .sim-op.certa .sim-op-l::after{content:"✓";} .sim-op.certa .sim-op-l{font-size:0;} .sim-op.certa .sim-op-l::after{font-size:15px;}
  .sim-op.errada .sim-op-l{font-size:0;} .sim-op.errada .sim-op-l::after{content:"✕"; font-size:14px;}

  .sim-fb{position:fixed; left:0; right:0; bottom:0; z-index:3; transform:translateY(100%); transition:transform .28s ease-out; max-height:62vh; overflow-y:auto; box-shadow:0 -10px 30px rgba(0,0,0,.35);}

  .sim-ini p{margin:0; opacity:.82; line-height:1.5;}
  .sim-ini-rec{font-size:14px;} .sim-ini-rec b{color:#FFD166;}
  .sim-ini-g{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .sim-ini-l{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.65;}
  .sim-seg{display:flex; flex-wrap:wrap; gap:8px;}

  .sim-seg button span{font-family:var(--mono); font-size:12px; opacity:.7; margin-left:4px;}
  .sim-seg button.on{background:#fff; color:#2A1B3D; border-color:#fff; font-weight:600;}
  .sim-ini-nota{font-size:13px; opacity:.65; line-height:1.45;}
  .sim-start{margin-top:8px; border:0; border-radius:12px; padding:16px; font-size:18px; font-weight:800; background:#7C5CFF; color:#fff; box-shadow:0 5px 0 #4B32B8;}
  .sim-start:active{transform:translateY(4px); box-shadow:0 1px 0 #4B32B8;}
  .sim-sec{border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:13px; font-size:15.5px; font-weight:600; background:rgba(255,255,255,.06); color:#fff;}

  .sim-fim{align-items:stretch; text-align:center;}
  .sim-anel{--p:0; width:150px; height:150px; margin:6px auto 0; border-radius:50%; background:conic-gradient(#22A45D calc(var(--p) * 1%), rgba(255,255,255,.12) 0); display:grid; place-items:center;}
  .sim-anel > div{width:120px; height:120px; border-radius:50%; background:#24183A; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .sim-anel b{font-size:34px; font-family:var(--serif);} .sim-anel span{font-size:12px; opacity:.7;}
  .sim-recorde{align-self:center; background:#FFD166; color:#2A1B3D; font-weight:700; padding:6px 12px; border-radius:8px; font-size:14px;}
  .sim-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sim-stats div{background:rgba(255,255,255,.07); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:2px;}
  .sim-stats b{font-size:20px;} .sim-stats span{font-size:12.5px; opacity:.7;}
  .sim-temas{text-align:left; display:flex; flex-direction:column; gap:7px; background:rgba(255,255,255,.05); border-radius:10px; padding:14px;}
  .sim-tema-l{display:grid; grid-template-columns:1fr 90px 42px; align-items:center; gap:10px; font-size:13.5px;}
  .sim-tema-l b{font-family:var(--mono); font-size:12.5px; text-align:right;}
  .sim-tema-bar{height:7px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden;}

  .sim-fim-acoes{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .sim-rev{text-align:left; display:flex; flex-direction:column; gap:12px; margin-top:8px;}
  .sim-rev[hidden]{display:none;}
  .sim-rev-i{background:rgba(255,255,255,.07); border-left:4px solid #22A45D; border-radius:8px; padding:14px;}
  .sim-rev-i.no{border-left-color:#E5484D;}

  .sim-rev-i.ok .sim-rev-h b{color:#5BD08F;} .sim-rev-i.no .sim-rev-h b{color:#FF8A8F;}
  .sim-rev-q{font-size:14.5px; line-height:1.5;}
  .sim-rev-sua{margin-top:8px; font-size:14px; color:#FFB0B4;}
  .sim-rev-certa{margin-top:6px; font-size:14px; color:#8BE3B0; font-weight:600;}
  .sim-rev-i p{margin:8px 0 0; font-size:13.5px; opacity:.8; line-height:1.5;}

  @media (max-width:700px){

  #simuladosLista{display:flex; flex-direction:column; gap:28px; margin-top:8px;}

  /* Experimental: trabalho com humanos */
  .exh-mat{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}

  .exh-campo{display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}

  .exh-alvo-b.on, .exh-tipo-b.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .exh-aviso{background:var(--ochre-soft); border-left:3px solid var(--ochre); padding:8px 12px; border-radius:6px; font-size:13.5px;}
  .exh-folha-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); border-radius:6px;}
  .exh-folha{border-collapse:collapse; width:100%; min-width:560px; font-size:13px;}

  .exh-folha .exh-v{text-align:left; font-weight:600; white-space:nowrap;}
  .exh-folha tr.exh-fase td{background:var(--petrol); color:#fff; font-weight:700; text-align:left; font-size:12.5px; padding:6px 8px;}
  .exh-folha tr.anul td.exh-v{text-decoration:line-through; color:var(--ink-faint);}
  .exh-b{width:34px; height:30px; border-radius:6px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); font-weight:800; cursor:pointer;}

  .exh-prog{font-size:13px; color:var(--ink-soft); margin:8px 0 14px;}
  .exh-perg{display:flex; flex-direction:column; gap:4px; font-size:13.5px; margin-bottom:8px;}
  .exh-tab{border-collapse:collapse; font-size:13px; margin:4px 0 12px;}

  .exh-tab th{background:var(--paper-alt); font-size:12px;} .exh-tab th small{font-weight:400; color:var(--ink-faint);}
  .exh-tab td:first-child{text-align:left; font-weight:600;} .exh-tab tfoot td{font-weight:700; background:var(--paper-alt);} .exh-tab tr.alvo td{background:color-mix(in srgb, var(--petrol) 12%, transparent); font-weight:700;}
  .exh-tipo{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0 8px; font-size:14px; font-weight:600;}

  .exh-vazio{margin:0; padding:34px 14px; text-align:center; color:#666; font-size:14px;}
