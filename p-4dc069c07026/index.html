<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arquivo Vivo · Trabalho com humanos (prévia)</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     ARQUIVO VIVO · identidade verde petróleo (clean)
     ========================================================= */
  :root{
    --bg:#F5F7F6;
    --paper:#FFFFFF;
    --paper-alt:#F0F4F3;
    --ink:#14211F;
    --ink-soft:#5B6A67;
    --ink-faint:#8A9794;
    --petrol:#1F5C56;
    --petrol-dark:#153F3B;
    --petrol-soft:#E3EFEC;
    --petrol-line:#C4DCD7;
    --ochre:#B7791F;
    --ochre-soft:#FBF1E1;
    --danger:#B5432E;
    --rule:#DFE6E4;
    --shadow: rgba(20,33,31,0.06);
    --shadow-lg: rgba(20,33,31,0.10);
    --radius:12px;
    --radius-sm:8px;
    --nav-h:68px;
    --maxw:1120px;
  }
  body.dark{
    --bg:#0F1615;
    --paper:#16201F;
    --paper-alt:#1C2826;
    --ink:#E8EFED;
    --ink-soft:#A3B2AF;
    --ink-faint:#7A8A87;
    --petrol:#5CC2B5;
    --petrol-dark:#3E9C90;
    --petrol-soft:#1B3330;
    --petrol-line:#2A4A46;
    --ochre:#E0A94A;
    --ochre-soft:#2E2617;
    --danger:#E07A63;
    --rule:#26332F;
    --shadow: rgba(0,0,0,0.25);
    --shadow-lg: rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--nav-h);
  }
  a{color:var(--petrol);}
  button{font-family:inherit;}
  ::selection{background:var(--petrol-soft);}
  :focus-visible{outline:2px solid var(--petrol); outline-offset:2px;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:40px 24px 64px;}
  .wrap:not(#top){max-width:880px;}
  @media (max-width:600px){ .wrap{padding:28px 18px 48px;} }

  /* ---------- Botões base ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-size:14.5px; font-weight:600;
    padding:12px 20px; border-radius:6px;
    border:1px solid transparent; cursor:pointer; text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn svg{width:17px; height:17px; flex:none;}
  .btn-primary{background:var(--petrol); color:#fff;}
  body.dark .btn-primary{color:#0F1615;}
  .btn-primary:hover{background:var(--petrol-dark); transform:translateY(-1px); box-shadow:0 6px 16px var(--shadow-lg);}
  .btn-ghost{background:var(--paper); color:var(--ink); border-color:var(--rule);}
  .btn-ghost:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .btn-sm{font-size:13px; padding:8px 14px; border-radius:8px;}

  /* =========================================================
     NAVEGAÇÃO FIXA
     ========================================================= */
  .site-nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    height:var(--nav-h);
    border-bottom:1px solid var(--rule);
  }
  /* fundo translúcido num pseudo-elemento: backdrop-filter no próprio header prenderia o menu do celular dentro dele */
  .site-nav::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:rgba(255,255,255,0.86);
    backdrop-filter:saturate(1.4) blur(12px);
    -webkit-backdrop-filter:saturate(1.4) blur(12px);
  }
  body.dark .site-nav::before{background:rgba(15,22,21,0.86);}
  body.nav-open .site-nav::before{background:var(--bg);}
  .nav-inner{
    max-width:var(--maxw); height:100%; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; gap:28px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    text-decoration:none; color:var(--ink); flex:none;
    background:none; border:none; padding:0; cursor:pointer;
  }
  .brand-mark{
    width:36px; height:36px; border-radius:6px;
    background:var(--petrol); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; letter-spacing:-0.02em;
  }
  body.dark .brand-mark{color:#0F1615;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15; text-align:left;}
  .brand-text strong{font-size:16px; font-weight:700; letter-spacing:-0.01em;}
  .brand-text small{font-size:11.5px; color:var(--ink-soft); font-weight:500;}

  .nav-menu{display:flex; align-items:center; gap:2px; flex:1;}
  .nav-link{
    display:inline-flex; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer;
    font-size:14px; font-weight:500; color:var(--ink-soft);
    padding:8px 12px; border-radius:8px;
    transition:color .15s ease, background .15s ease;
  }
  .nav-link:hover{color:var(--ink); background:var(--paper-alt);}
  .nav-link.active{color:var(--petrol); font-weight:600;}
  .nav-link .caret{width:14px; height:14px; transition:transform .15s ease;}
  .nav-group{position:relative;}
  .nav-group.open .caret{transform:rotate(180deg);}
  .nav-group-label{display:none;}
  .nav-dropdown{
    position:absolute; top:calc(100% + 8px); left:-8px;
    min-width:290px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:0 18px 40px var(--shadow-lg);
    padding:8px;
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
  }
  .nav-group.open .nav-dropdown{opacity:1; visibility:visible; transform:none;}
  .nav-item{
    display:flex; align-items:flex-start; gap:12px; width:100%;
    background:none; border:none; cursor:pointer; text-align:left;
    padding:10px 12px; border-radius:8px; color:var(--ink);
    text-decoration:none;
  }
  .nav-item:hover{background:var(--paper-alt);}
  .nav-item.active{background:var(--petrol-soft);}
  .nav-item .ni-icon{
    flex:none; width:34px; height:34px; border-radius:9px;
    background:var(--petrol-soft); color:var(--petrol);
    display:flex; align-items:center; justify-content:center;
  }
  .nav-item .ni-icon svg{width:17px; height:17px;}
  .nav-item .ni-text{display:flex; flex-direction:column; line-height:1.3;}
  .nav-item .ni-text strong{font-size:14px; font-weight:600;}
  .nav-item .ni-text small{font-size:12.5px; color:var(--ink-soft);}

  .nav-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .icon-btn{
    width:38px; height:38px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--rule);
    color:var(--ink-soft); cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .icon-btn:hover{color:var(--petrol); border-color:var(--petrol-line); background:var(--paper);}
  .icon-btn svg{width:18px; height:18px;}
  .nav-burger{display:none;}
  .nav-cta{padding:9px 16px; font-size:13.5px;}

  @media (max-width:1000px){
    .nav-cta{display:none;}
  }
  @media (max-width:880px){
    :root{--nav-h:62px;}
    .nav-inner{padding:0 16px; gap:12px; justify-content:space-between;}
    .nav-burger{display:flex;}
    .nav-menu{
      position:fixed; top:var(--nav-h); left:0; right:0; bottom:0;
      flex-direction:column; align-items:stretch; gap:4px;
      background:var(--bg);
      padding:16px 16px 40px;
      overflow-y:auto;
      opacity:0; visibility:hidden; transform:translateY(-6px);
      transition:opacity .18s ease, transform .18s ease, visibility .18s;
    }
    body.nav-open .nav-menu{opacity:1; visibility:visible; transform:none;}
    body.nav-open{overflow:hidden;}
    .nav-link{font-size:16px; padding:12px; justify-content:flex-start;}
    .nav-group > .nav-trigger{display:none;}
    .nav-group-label{
      display:block; font-size:11.5px; font-weight:600; letter-spacing:.08em;
      text-transform:uppercase; color:var(--ink-faint);
      padding:18px 12px 6px;
    }
    .nav-dropdown{
      position:static; opacity:1; visibility:inherit; transform:none;
      box-shadow:none; border:none; background:transparent; padding:0; min-width:0;
    }
    .nav-mobile-cta{display:flex !important; margin:20px 12px 0;}
  }
  .nav-mobile-cta{display:none !important;}

  /* =========================================================
     HOME · HERO
     ========================================================= */
  #top{padding-top:56px;}
  .hero{
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:48px; align-items:center;
    padding-bottom:56px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; letter-spacing:.02em;
    color:var(--petrol);
    background:var(--petrol-soft);
    padding:6px 12px; border-radius:999px;
    margin-bottom:20px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--petrol);}
  h1{
    font-weight:800;
    font-size:clamp(32px, 5vw, 54px);
    line-height:1.06;
    letter-spacing:-0.035em;
    margin:0 0 18px;
  }
  .hero h1 .hl{color:var(--petrol);}
  .lead{
    font-size:17.5px; line-height:1.6; color:var(--ink-soft);
    margin:0 0 28px; max-width:56ch;
  }
  .hero-ctas{display:flex; flex-wrap:wrap; gap:12px;}
  .hero-meta{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px;
    margin-top:26px; font-size:13px; color:var(--ink-faint);
  }
  .hero-meta .live{display:inline-flex; align-items:center; gap:7px;}
  .hero-meta .live::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:#2FA36B; box-shadow:0 0 0 3px rgba(47,163,107,.18);
  }

  .hero-panel{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:6px;
    box-shadow:0 24px 60px var(--shadow-lg);
    padding:24px;
    display:flex; flex-direction:column; gap:20px;
  }
  .panel-label{
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px;
  }
  .progress-block .label{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-size:13.5px; color:var(--ink-soft); margin-bottom:9px; flex-wrap:wrap;
  }
  .progress-block .label strong{color:var(--ink); font-size:15px;}
  .progress-track{
    height:8px; background:var(--paper-alt); border-radius:999px; overflow:hidden;
  }
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--petrol-dark), var(--petrol)); border-radius:999px;}
  .panel-divider{height:1px; background:var(--rule); margin:0 -24px;}

  /* Próximo prazo (gerado via JS) */
  #topDeadline:empty{display:none;}
  .top-deadline{display:flex; flex-direction:column; gap:10px;}
  .top-deadline .alert-badge{
    align-self:flex-start;
    font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--petrol) !important; background:var(--petrol-soft) !important;
    padding:4px 10px; border-radius:999px;
  }
  .top-deadline.alert .alert-badge{color:var(--ochre) !important; background:var(--ochre-soft) !important;}
  .top-deadline .txt{font-size:14.5px; line-height:1.5; color:var(--ink);}
  .top-deadline .txt strong{font-weight:700;}
  .vence-destaque{color:var(--ochre);}
  .top-deadline.alert .vence-destaque{color:var(--danger);}
  .deadline-more-link{
    display:inline-flex; align-items:center; gap:4px;
    margin-top:10px; font-size:13.5px; font-weight:600;
    color:var(--petrol); text-decoration:none;
  }
  .deadline-more-link:hover{text-decoration:underline;}

  @media (max-width:900px){
    #top{padding-top:32px;}
    .hero{grid-template-columns:1fr; gap:32px; padding-bottom:40px;}
    .lead{font-size:16px;}
  }
  @media (max-width:520px){
    .hero-ctas .btn{flex:1 1 100%;}
  }

  /* ---------- Acesso rápido ---------- */
  .quick-grid{
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px;
  }
  .quick-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:12px;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:22px; text-align:left; cursor:pointer; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .quick-card:hover{border-color:var(--petrol-line); box-shadow:0 12px 28px var(--shadow-lg); transform:translateY(-2px);}
  .quick-card .qc-icon{
    width:42px; height:42px; border-radius:6px;
    background:var(--petrol-soft); color:var(--petrol);
    display:flex; align-items:center; justify-content:center;
  }
  .quick-card .qc-icon svg{width:21px; height:21px;}
  .quick-card .qc-body{display:flex; flex-direction:column; gap:5px;}
  .quick-card strong{font-size:16px; font-weight:700; letter-spacing:-0.01em;}
  .quick-card span{font-size:14px; color:var(--ink-soft); line-height:1.5;}
  .quick-card .qc-go{margin-top:auto; font-size:13.5px; font-weight:600; color:var(--petrol);}
  @media (max-width:860px){ .quick-grid{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media (max-width:520px){
    .quick-grid{grid-template-columns:1fr; gap:10px;}
    .quick-card{flex-direction:row; align-items:center; padding:16px;}
    .quick-card .qc-body{display:flex; flex-direction:column;}
    .quick-card span.qc-desc{font-size:13px;}
    .quick-card .qc-go{display:none;}
  }

  /* ---------- Títulos de seção ---------- */
  .home-section{margin-top:72px;}
  .hero + div + .home-section{margin-top:8px;}
  .section-title{
    scroll-margin-top:calc(var(--nav-h) + 24px);
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin:0 0 22px;
  }
  .section-title .st-text{display:flex; flex-direction:column; gap:6px;}
  .section-title .num{
    font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--petrol);
  }
  .section-title h2{
    font-size:clamp(24px, 3vw, 30px); font-weight:800; letter-spacing:-0.025em; line-height:1.15; margin:0;
  }
  .section-title .count{
    font-size:14px; font-weight:600; color:var(--ink-faint); margin-left:6px;
  }
  .section-title .st-desc{font-size:15px; color:var(--ink-soft); margin:0; max-width:60ch;}
  .section-title .rule{display:none;}

  /* ---------- Abas de semestre ---------- */
  .tabs{
    display:inline-flex; gap:4px; padding:4px;
    background:var(--paper-alt); border:1px solid var(--rule); border-radius:6px;
  }
  .tab{
    font-size:13.5px; font-weight:600;
    padding:8px 16px; border:none; border-radius:7px;
    background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px var(--shadow-lg);}

  /* ---------- Cards de disciplina ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:20px; display:flex; flex-direction:column; gap:14px;
    text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{border-color:var(--petrol-line); box-shadow:0 12px 28px var(--shadow-lg); transform:translateY(-2px);}
  .card-top{display:flex; align-items:center; justify-content:space-between;}
  .card .idx{
    font-size:12.5px; font-weight:700; color:var(--petrol);
    background:var(--petrol-soft); padding:4px 9px; border-radius:6px;
  }
  .drive-tag{display:flex; align-items:center; gap:6px;}
  .drive-tag span{font-size:12px; color:var(--ink-faint); font-weight:500;}
  .drive-icon{width:22px; height:22px; flex:none;}
  .card .name{font-size:16.5px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;}
  .card .open{margin-top:auto; font-size:13.5px; font-weight:600; color:var(--ink-soft); transition:color .15s ease;}
  .card:hover .open{color:var(--petrol);}

  /* ---------- Feed de atualizações ---------- */
  .feed{
    display:flex; flex-direction:column;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    overflow:hidden;
  }
  .entry{display:flex; gap:20px; align-items:flex-start; padding:18px 22px; border-bottom:1px solid var(--rule);}
  .entry:last-child{border-bottom:none;}
  .stamp{
    flex:none; width:56px; text-align:center;
    background:var(--paper-alt); border-radius:6px; padding:8px 4px;
    color:var(--ink);
  }
  .stamp .d{font-size:19px; font-weight:800; line-height:1; letter-spacing:-0.02em;}
  .stamp .m{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:3px;}
  .entry-body{flex:1; min-width:0;}
  .entry-body .tag{
    display:inline-block; font-size:12px; font-weight:600;
    color:var(--petrol); background:var(--petrol-soft);
    padding:3px 9px; border-radius:6px; margin-bottom:7px;
  }
  .entry-body p{margin:0; font-size:15px; line-height:1.5; color:var(--ink);}
  .new-badge{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.02em;
    color:var(--ochre); background:var(--ochre-soft);
    padding:3px 8px; border-radius:6px; margin-left:8px; vertical-align:middle;
  }
  .empty{
    font-size:14px; color:var(--ink-soft);
    border:1px dashed var(--rule); padding:24px; text-align:center; border-radius:var(--radius);
    background:var(--paper);
  }
  .feed .empty{border:none;}

  /* ---------- Faixa do WhatsApp ---------- */
  .cta-band{
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:center;
    background:var(--petrol-dark); color:#fff;
    border-radius:6px; padding:34px 36px;
    position:relative; overflow:hidden;
  }
  body.dark .cta-band{background:#183634;}
  .cta-band::after{
    content:""; position:absolute; right:-80px; top:-80px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
    pointer-events:none;
  }
  .cta-band h3{font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px;}
  .cta-band p{margin:0; font-size:14.5px; line-height:1.6; color:rgba(255,255,255,.82); max-width:62ch;}
  .cta-band .whatsapp-join{
    display:inline-flex; align-items:center; gap:9px;
    background:#fff; color:var(--petrol-dark);
    font-size:14.5px; font-weight:700; text-decoration:none;
    padding:13px 22px; border-radius:6px; white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
    position:relative; z-index:1;
  }
  body.dark .cta-band .whatsapp-join{color:#183634;}
  .cta-band .whatsapp-join:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,.2);}
  .cta-band .whatsapp-join svg{width:18px; height:18px;}
  @media (max-width:700px){
    .cta-band{grid-template-columns:1fr; padding:26px 22px;}
    .cta-band .whatsapp-join{justify-content:center;}
  }

  /* ---------- Avisos ---------- */
  .notice{
    display:block; margin:0 0 24px;
    font-size:14px; line-height:1.6; color:var(--ink-soft);
    background:var(--ochre-soft);
    border:1px solid rgba(183,121,31,.22);
    border-radius:var(--radius-sm);
    padding:14px 16px;
  }
  .notice strong{color:var(--ink);}
  .thin-rule{border-top:1px solid var(--rule); margin:28px 0;}

  /* ---------- Números ---------- */
  .stats-title{display:none;}
  .stats-strip{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr));
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    overflow:hidden;
  }
  .stat-chip{
    padding:20px 18px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);
    margin:0 -1px -1px 0;
  }
  .stat-num{font-size:26px; font-weight:800; letter-spacing:-0.03em; color:var(--ink); line-height:1.1;}
  .stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .stats-nota{font-size:12.5px; color:var(--ink-faint); margin-top:12px; line-height:1.55;}

  /* =========================================================
     RODAPÉ GLOBAL
     ========================================================= */
  .site-footer{
    background:var(--paper); border-top:1px solid var(--rule);
    margin-top:40px;
  }
  .footer-inner{
    max-width:var(--maxw); margin:0 auto; padding:48px 24px 32px;
    display:grid; grid-template-columns:minmax(0,1.4fr) repeat(3, minmax(0,1fr)) auto; gap:32px;
  }
  .footer-brand p{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:14px 0 0; max-width:36ch;}
  .footer-col h4{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin:4px 0 12px;}
  .footer-col button{
    display:block; background:none; border:none; padding:5px 0; cursor:pointer;
    font-size:14px; color:var(--ink-soft); text-align:left;
  }
  .footer-col button:hover{color:var(--petrol);}
  .qr-block{display:flex; flex-direction:column; align-items:flex-start; gap:10px;}
  .qr-block #qrcode{padding:6px; background:#fff; border:1px solid var(--rule); border-radius:6px; line-height:0;}
  .qr-block span{font-size:12px; color:var(--ink-faint); max-width:110px; line-height:1.4;}
  .footer-bottom{
    max-width:var(--maxw); margin:0 auto; padding:18px 24px 28px;
    border-top:1px solid var(--rule);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    font-size:13px; color:var(--ink-faint);
  }
  @media (max-width:900px){
    .footer-inner{grid-template-columns:1fr 1fr; gap:28px;}
    .footer-brand{grid-column:1 / -1;}
    .qr-block{display:none;}
  }
  @media (max-width:600px){
    .wrap{padding-bottom:28px;}
    .site-footer{margin-top:8px;}
    .footer-inner{grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px 12px; padding:26px 18px 18px;}
    .footer-brand p{font-size:13px; margin-top:10px; max-width:none;}
    .footer-col h4{font-size:11px; margin:0 0 6px;}
    .footer-col button{font-size:13px; padding:4px 0; line-height:1.35;}
    .footer-bottom{padding:14px 18px 22px; font-size:12px;}
  }
  /* rodapés antigos dentro de cada página: substituídos pelo global */
  .wrap > footer{display:none;}

  /* =========================================================
     PÁGINAS INTERNAS
     ========================================================= */
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
    background:none; border:none; padding:0; margin-bottom:22px; cursor:pointer;
  }
  .back-link:hover{color:var(--petrol);}
  .wrap:not(#top) > header,
  .cine-header, .arena-header{
    padding:0 0 28px; margin:0 0 32px;
    border-bottom:1px solid var(--rule);
  }
  .wrap:not(#top) > header .eyebrow,
  .cine-eyebrow, .arena-eyebrow{
    display:inline-flex; font-size:12.5px; font-weight:600; letter-spacing:.02em; text-transform:none;
    color:var(--petrol); background:var(--petrol-soft); padding:5px 11px; border-radius:999px;
    margin-bottom:16px;
  }
  .wrap:not(#top) > header h1,
  .cine-title, .arena-title{
    font-size:clamp(30px, 4.5vw, 44px); font-weight:800; letter-spacing:-0.035em; font-style:normal;
    margin:0 0 12px; color:var(--ink); text-shadow:none;
    background:none; -webkit-text-fill-color:currentColor;
  }
  .wrap:not(#top) > header p,
  .cine-sub, .arena-sub{font-size:16.5px; line-height:1.6; color:var(--ink-soft); margin:0; max-width:64ch;}
  .wrap:not(#top) > header .notice{margin:20px 0 0;}
  .wrap:not(#top) > p{font-size:15.5px; line-height:1.7; color:var(--ink); margin:0 0 16px;}
  .wrap:not(#top) h4{font-family:inherit !important; font-size:17px !important; font-weight:700; letter-spacing:-0.01em;}

  /* ---------- Prazos ---------- */
  .tasks{display:flex; flex-direction:column; gap:12px;}
  .task{
    display:flex; align-items:center; gap:16px;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:16px 18px; position:relative;
  }
  .task::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--petrol);}
  .task.urgent::before{background:var(--ochre);}
  .task-info{flex:1; min-width:0;}
  .task-info .materia{font-size:12.5px; font-weight:600; color:var(--petrol); margin-bottom:3px;}
  .task-info .tarefa{font-size:16px; font-weight:700; line-height:1.35; letter-spacing:-0.01em;}
  .task-info .prazo-data{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .countdown-wrap{flex:none; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .countdown-wrap .new-badge{margin-left:0;}
  .countdown{
    flex:none; text-align:center; min-width:64px;
    background:var(--petrol-soft); color:var(--petrol);
    border-radius:6px; padding:9px 12px;
  }
  .task.urgent .countdown{background:var(--ochre-soft); color:var(--ochre);}
  .countdown .n{font-size:20px; font-weight:800; line-height:1;}
  .countdown .u{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
  .cal-btn{
    flex:none; font-size:13px; font-weight:600; color:var(--ink-soft);
    border:1px solid var(--rule); border-radius:8px; padding:7px 11px;
    text-decoration:none; white-space:nowrap; background:var(--paper);
  }
  .cal-btn:hover{border-color:var(--petrol-line); color:var(--petrol);}
  @media (max-width:560px){
    .task{flex-wrap:wrap;}
    .task-info{flex:1 1 100%;}
    .countdown-wrap{flex-direction:row;}
  }

  /* ---------- Acordeões (ferramentas, cemitério, conteúdo de apoio) ---------- */
  .graveyard{
    margin-top:12px;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    overflow:hidden;
  }
  .graveyard summary{
    display:flex; align-items:center; gap:10px;
    list-style:none; cursor:pointer;
    font-size:15px; color:var(--ink); padding:16px 18px;
  }
  .graveyard summary::-webkit-details-marker{display:none;}
  .graveyard summary::after{
    content:""; margin-left:auto; flex:none; width:9px; height:9px;
    border-right:2px solid var(--ink-faint); border-bottom:2px solid var(--ink-faint);
    transform:rotate(45deg) translateY(-3px); transition:transform .15s ease;
  }
  .graveyard[open] > summary::after{transform:rotate(-135deg) translateY(-2px);}
  .graveyard summary:hover{background:var(--paper-alt);}
  .graveyard summary strong{
    flex:none; font-size:12px; font-weight:600; color:var(--petrol);
    background:var(--petrol-soft); padding:3px 9px; border-radius:6px;
  }
  .graveyard[open] > summary{border-bottom:1px solid var(--rule);}
  .graveyard > .tool-card, .graveyard > .grave-list{margin:0 !important; border:none; border-radius:0;}
  .graveyard > .grave-list{padding:14px;}
  .grave-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .grave-item{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding:11px 14px; background:var(--paper-alt); border-radius:8px; opacity:.8;
  }
  .grave-item .materia{font-size:12px; font-weight:600; color:var(--ink-soft); flex:none;}
  .grave-item .tarefa{font-size:14px; color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint); flex:1;}
  .grave-item .prazo-data{font-size:12.5px; color:var(--ink-faint); flex:none;}

  /* ---------- Cursos ---------- */
  .courses{display:flex; flex-direction:column; gap:12px;}
  .course{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:18px 20px; text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .course:hover{border-color:var(--petrol-line); box-shadow:0 10px 24px var(--shadow-lg);}
  .course-info .nome{font-size:16px; font-weight:700; letter-spacing:-0.01em;}
  .course-info .nota{font-size:13.5px; color:var(--ink-soft); margin-top:3px;}
  .course-go{flex:none; font-size:14px; font-weight:600; color:var(--petrol); white-space:nowrap;}

  /* ---------- Para estudar ---------- */
  .study-list{display:flex; flex-direction:column; gap:36px;}
  .study-group{display:flex; flex-direction:column; gap:12px;}
  .study-group-title{font-size:19px; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px;}
  .study-card{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:20px 22px; text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .study-card:hover{border-color:var(--petrol-line); box-shadow:0 12px 28px var(--shadow-lg); transform:translateY(-1px);}
  .study-card .study-title{font-size:17px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;}
  .study-card .study-subtitle{font-size:13px; font-weight:600; color:var(--petrol); margin-top:3px;}
  .study-card .study-desc{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin-top:7px; max-width:68ch;}
  .study-card .study-go{
    flex:none; font-size:14px; font-weight:600; color:#fff; background:var(--petrol);
    padding:9px 16px; border-radius:9px; white-space:nowrap;
  }
  body.dark .study-card .study-go{color:#0F1615;}
  @media (max-width:600px){
    .study-card{flex-direction:column; align-items:flex-start; gap:14px;}
  }

  /* ---------- Ferramentas ---------- */
  .tool-card{
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    padding:24px; margin-top:8px;
  }
  .tool-card h2{font-size:20px; font-weight:800; margin:0 0 6px;}
  .tool-card .sub{font-size:14.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.6;}
  .prompt-box{
    background:var(--paper-alt); border:none; border-left:3px solid var(--petrol);
    border-radius:var(--radius-sm); padding:16px 18px; margin-bottom:16px;
  }
  .prompt-box .plabel{font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .prompt-box .pfrase{font-size:16.5px; color:var(--ink); line-height:1.55;}
  .shuffle-btn{
    font-size:13.5px; font-weight:600; background:var(--paper);
    border:1px solid var(--rule); color:var(--ink-soft);
    padding:8px 14px; border-radius:8px; cursor:pointer; margin-top:10px;
  }
  .shuffle-btn:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .tool-card textarea{
    width:100%; font-family:inherit; font-size:15px;
    padding:12px 14px; border:1px solid var(--rule); border-radius:var(--radius-sm);
    background:var(--paper); color:var(--ink); min-height:110px; resize:vertical; margin-bottom:12px;
  }
  .tool-card textarea:focus, .tool-card select:focus{outline:2px solid var(--petrol-line); border-color:var(--petrol);}
  .tool-card select{border-radius:8px !important; font-family:inherit !important;}
  .correct-btn{
    font-size:14.5px; font-weight:600;
    background:var(--petrol); color:#fff; border:none;
    padding:11px 22px; border-radius:6px; cursor:pointer;
  }
  body.dark .correct-btn{color:#0F1615;}
  .correct-btn:hover{background:var(--petrol-dark);}
  .pfeedback{margin-top:18px; padding:16px 18px; border-radius:var(--radius-sm); font-size:14.5px; line-height:1.6; display:none;}
  .pfeedback.show{display:block;}
  .pfeedback.good{background:var(--petrol-soft); border-left:3px solid var(--petrol); color:var(--ink);}
  .pfeedback.partial{background:var(--ochre-soft); border-left:3px solid var(--ochre); color:var(--ink);}
  .pfeedback.bad{background:rgba(181,67,46,0.09); border-left:3px solid var(--danger); color:var(--ink);}
  .pfeedback strong{display:block; margin-bottom:6px; font-size:15px;}
  .reveal-btn{
    font-size:13.5px; font-weight:600; background:none; border:none;
    color:var(--petrol); text-decoration:underline; cursor:pointer; padding:0; margin-top:14px; display:none;
  }
  .model-answer{
    display:none; margin-top:10px; padding:12px 14px;
    background:var(--paper-alt); border-radius:var(--radius-sm);
    font-size:14px; color:var(--ink-soft);
  }
  .model-answer.show{display:block;}
  .tool-disclaimer{
    margin-top:24px; font-size:12.5px; color:var(--ink-faint); line-height:1.6;
    border-top:1px solid var(--rule); padding-top:14px;
  }
  .opcao-radio{
    display:flex; align-items:flex-start; gap:10px; font-size:14.5px;
    padding:10px 12px; cursor:pointer; border-radius:8px; border:1px solid transparent;
  }
  .opcao-radio:hover{background:var(--paper-alt); border-color:var(--rule);}
  .opcao-radio input{margin-top:4px; accent-color:var(--petrol);}
  .gm-item{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 14px; background:var(--paper-alt); border:1px solid var(--rule); border-radius:var(--radius-sm);
  }
  .gm-item.ok{border-color:var(--petrol); background:var(--petrol-soft);}
  .gm-item.err{border-color:var(--danger); background:rgba(181,67,46,0.07);}
  .gm-item .gm-texto{flex:1; font-size:14.5px; line-height:1.45;}
  .gm-item select{
    flex:none; font-family:inherit; font-size:14px; padding:7px 9px;
    border:1px solid var(--rule); border-radius:8px; background:var(--paper); color:var(--ink);
  }
  .gm-item .gm-nota{flex-basis:100%; font-size:13px; color:var(--ink-soft); display:none;}
  .gm-item.err .gm-nota{display:block;}

  /* ---------- Instalar ---------- */
  .install-tabs{
    display:inline-flex; gap:4px; padding:4px; margin:0 0 22px;
    background:var(--paper-alt); border:1px solid var(--rule); border-radius:6px;
  }
  .install-tab{
    font-size:13.5px; font-weight:600; padding:8px 16px;
    border:none; border-radius:7px; background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .install-tab.active{background:var(--paper); color:var(--ink); box-shadow:0 1px 3px var(--shadow-lg);}
  .install-steps{display:flex; flex-direction:column; gap:12px;}
  .install-step{
    display:flex; gap:16px; align-items:flex-start;
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius); padding:18px 20px;
  }
  .install-icon{
    flex:none; width:46px; height:46px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background:var(--petrol-soft); color:var(--petrol);
  }
  .install-num{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--petrol); margin-bottom:4px;}
  .install-text p{margin:0; font-size:15px; line-height:1.6; color:var(--ink);}

  /* ---------- Vídeos (agora no mesmo padrão visual) ---------- */
  .cine{background:none; color:var(--ink); padding-top:40px;}
  .filmstrip{display:none;}
  .cine-back{color:var(--ink-soft);}
  .video-disc{
    background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius);
    margin-bottom:12px; overflow:hidden;
  }
  .video-disc summary{display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; list-style:none;}
  .video-disc summary:hover{background:var(--paper-alt);}
  .video-disc summary::-webkit-details-marker{display:none;}
  .video-disc .vd-num{font-size:12.5px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); padding:4px 9px; border-radius:6px; flex:none;}
  .video-disc .vd-name{font-size:15.5px; font-weight:600; color:var(--ink); flex:1;}
  .video-disc .vd-count{font-size:13px; color:var(--ink-faint); flex:none;}
  .video-disc .vd-caret{flex:none; font-size:10px; color:var(--ink-faint); transition:transform .15s ease;}
  .video-disc[open] .vd-caret{transform:rotate(90deg);}
  .video-list{padding:4px 18px 20px; border-top:1px solid var(--rule);}
  .video-empty{font-size:14px; color:var(--ink-faint); padding:16px 0 4px;}
  .video-item{margin-top:18px;}
  .video-item .vi-title{font-size:15px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .video-item .vi-nota{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
  .video-frame{position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:var(--radius-sm); overflow:hidden;}
  .video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:none;}
  .yt-fora{display:inline-block; margin-top:4px; font-family:var(--mono, monospace); font-size:12px; color:var(--petrol); text-decoration:none;}
  .yt-fora:hover{text-decoration:underline;}

  /* ---------- Simulados (oculta, mas no mesmo padrão) ---------- */
  .arena{background:none; color:var(--ink);}
  .arena-disc{background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius); margin-bottom:12px; overflow:hidden;}
  .arena-disc summary{display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; list-style:none;}
  .arena-disc summary::-webkit-details-marker{display:none;}
  .arena-disc .ad-num{font-size:12.5px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); padding:4px 9px; border-radius:6px; flex:none;}
  .arena-disc .ad-name{font-size:15.5px; font-weight:600; flex:1;}
  .arena-disc .ad-count{font-size:13px; color:var(--ink-faint); flex:none;}
  .arena-disc .ad-caret{flex:none; font-size:10px; color:var(--ink-faint);}
  .arena-disc[open] .ad-caret{transform:rotate(90deg);}
  .arena-quiz-list{padding:4px 18px 18px; border-top:1px solid var(--rule);}
  .arena-empty{font-size:14px; color:var(--ink-faint); padding:14px 0 4px;}
  .arena-quiz{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:12px; padding:14px 16px; background:var(--paper-alt); border-radius:var(--radius-sm);}
  .arena-quiz-info .aq-title{font-size:15px; font-weight:600;}
  .arena-quiz-info .aq-nota{font-size:13px; color:var(--ink-soft);}
  .arena-play-btn{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:#fff; background:var(--petrol); padding:9px 16px; border-radius:9px; text-decoration:none;}

  /* ---------- Conteúdo de apoio ---------- */
  .apx-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .apx-chip{font-size:13.5px; font-weight:600; padding:8px 14px; border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft); border-radius:999px; cursor:pointer;}
  .apx-chip:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .apx-chip.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  body.dark .apx-chip.on{color:#0F1615;}
  .apx-h{font-size:18px; font-weight:800; letter-spacing:-0.015em; margin:32px 0 8px;}
  .apx-grid{display:flex; flex-wrap:wrap; gap:4px; margin:10px 0;}
  .apx-cell{width:30px; height:30px; font-size:11px; border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft); border-radius:6px; cursor:pointer; padding:0;}
  .apx-cell.base{border-bottom:3px solid var(--ochre);}
  .apx-cell.on{background:var(--petrol); border-color:var(--petrol); color:#fff; font-weight:700;}
  .apx-row{display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:14px; margin:8px 0;}
  .apx-row input[type=text], .apx-row input[type=number]{font:inherit; padding:7px 9px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:8px;}
  .apx-row input[type=number]{width:74px;}
  .apx-svg{width:100%; background:var(--paper); border:1px solid var(--rule); border-radius:var(--radius-sm); color:var(--ink);}
  .apx-steps label{display:flex; gap:10px; padding:9px 4px; font-size:14.5px; line-height:1.5; cursor:pointer;}
  .apx-steps input{accent-color:var(--petrol);}
  .apx-box{background:var(--paper-alt); border-left:3px solid var(--petrol); border-radius:var(--radius-sm); padding:13px 15px; font-size:14.5px; line-height:1.6; margin-top:10px;}
  .apx-table{border-collapse:collapse; font-size:13.5px; margin-top:8px; border-radius:8px; overflow:hidden;}
  .apx-table th, .apx-table td{border:1px solid var(--rule); padding:7px 14px; text-align:center;}
  .apx-table th{background:var(--paper-alt); color:var(--ink-soft); font-weight:600;}
  .apx-table td.f{color:var(--petrol); font-weight:700;}
  .apx-steps code{background:var(--paper-alt); border:1px solid var(--rule); padding:1px 6px; border-radius:5px; font-size:13px;}

  /* ===== Correção: menu do celular fechado não intercepta toques ===== */
  @media (max-width:880px){
    .nav-menu{pointer-events:none;}
    body.nav-open .nav-menu{pointer-events:auto;}
  }

  /* ===== Drive em destaque ===== */
  .drive-block{
    margin-top:8px;
    background:var(--paper);
    border:1px solid var(--petrol-line);
    border-radius:6px;
    padding:30px 30px 32px;
    box-shadow:0 20px 50px var(--shadow-lg);
    position:relative; overflow:hidden;
  }
  .drive-block::before{content:""; position:absolute; left:0; right:0; top:0; height:5px; background:linear-gradient(90deg, var(--petrol-dark), var(--petrol), #4FA89C);}
  .drive-block .section-title{margin-bottom:24px;}
  .drive-head{display:flex; align-items:flex-start; gap:16px;}
  .drive-badge{
    flex:none; width:54px; height:54px; border-radius:6px;
    background:var(--petrol); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(31,92,86,.28);
  }
  body.dark .drive-badge{color:#0F1615;}
  .drive-badge svg{width:26px; height:26px;}
  .drive-block .section-title h2{font-size:clamp(26px, 3.4vw, 34px);}
  .drive-block .grid{grid-template-columns:repeat(auto-fill, minmax(240px,1fr));}
  .drive-block .card{background:var(--paper-alt); border-color:transparent; padding:22px;}
  .drive-block .card:hover{background:var(--paper); border-color:var(--petrol-line);}
  .drive-block .card .name{font-size:17.5px;}
  .drive-block .card .open{color:var(--petrol);}
  .drive-block .drive-icon{width:26px; height:26px;}
  .drive-folders{font-size:12.5px; color:var(--ink-faint); margin-top:-6px;}
  .nav-link.nav-drive{color:var(--petrol); font-weight:600;}
  .nav-link.nav-drive svg{width:16px; height:16px;}
  .nav-link.nav-drive:hover{background:var(--petrol-soft);}
  .drive-block + div + .home-section{margin-top:56px;}

  /* atalho do calendário em destaque */
  .quick-card.qc-feature{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .quick-card.qc-feature .qc-icon{background:rgba(255,255,255,.16); color:#fff;}
  .quick-card.qc-feature span, .quick-card.qc-feature .qc-go{color:rgba(255,255,255,.88);}
  .quick-card.qc-feature:hover{background:var(--petrol-dark);}
  body.dark .quick-card.qc-feature{color:#0F1615;}
  body.dark .quick-card.qc-feature span, body.dark .quick-card.qc-feature .qc-go{color:rgba(15,22,21,.85);}
  body.dark .quick-card.qc-feature .qc-icon{background:rgba(0,0,0,.12); color:#0F1615;}

  /* ===== Calendário ===== */
  .cal-section{scroll-margin-top:calc(var(--nav-h) + 20px); margin-bottom:44px;}
  .cal-head h2, .extras-sub{font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0 0 6px;}
  .extras-sub{margin:0 0 4px;}
  .cal-head p{margin:0 0 16px; font-size:15px; color:var(--ink-soft);}
  .cal-card{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:18px; box-shadow:0 10px 30px var(--shadow);}
  .cal-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .cal-month{font-size:18px; font-weight:800; letter-spacing:-0.02em; min-width:0; flex:1; text-align:center; order:2;}
  #calPrev{order:1;} #calNext{order:3;} .cal-today{order:4;}
  .cal-nav, .cal-today{
    height:36px; min-width:36px; border-radius:9px; border:1px solid var(--rule);
    background:var(--paper); color:var(--ink); cursor:pointer; font-size:18px; line-height:1;
  }
  .cal-today{font-size:13px; font-weight:600; padding:0 12px;}
  .cal-nav:hover, .cal-today:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .cal-weekdays, .cal-grid{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px;}
  .cal-weekdays span{font-size:12px; font-weight:600; color:var(--ink-faint); text-align:center; text-transform:uppercase; letter-spacing:.04em; padding-bottom:4px;}
  .cal-day{
    min-height:92px; display:flex; flex-direction:column; align-items:stretch; gap:4px;
    background:var(--paper-alt); border:1px solid transparent; border-radius:6px;
    padding:7px; text-align:left; cursor:pointer; color:var(--ink); font:inherit;
  }
  .cal-day:not(.tem){cursor:default;}
  .cal-day.fora{opacity:.4;}
  .cal-day.passado .cal-num{color:var(--ink-faint);}
  .cal-day.passado.tem{opacity:.6;}
  .cal-day.tem:hover{border-color:var(--petrol-line);}
  .cal-day.hoje .cal-num{background:var(--petrol); color:#fff; border-radius:999px; width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
  body.dark .cal-day.hoje .cal-num{color:#0F1615;}
  .cal-day.sel{border-color:var(--petrol); background:var(--petrol-soft);}
  .cal-num{font-size:13px; font-weight:700;}
  .cal-chips{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .cal-chip{
    display:block; font-size:11px; font-weight:600; line-height:1.3;
    color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent);
    border-left:3px solid var(--c); border-radius:4px; padding:2px 5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  body.dark .cal-chip{color:#E8EFED;}
  .cal-dots{display:none; gap:3px; flex-wrap:wrap;}
  .cal-dots i, .cal-legend i{display:inline-block; width:8px; height:8px; border-radius:50%;}
  .cal-legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .cal-detail{margin-top:16px; border-top:1px solid var(--rule); padding-top:14px;}
  .cal-detail-title{font-size:15px; font-weight:700; margin-bottom:10px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .cal-quando{text-transform:none; font-size:12px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); padding:3px 9px; border-radius:999px;}
  .cal-quando.urgente{color:var(--ochre); background:var(--ochre-soft);}
  .cal-empty{font-size:14px; color:var(--ink-faint);}
  .cal-item{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--paper-alt); border-left:3px solid var(--c); border-radius:8px; margin-top:8px;}
  .cal-item-mat{font-size:12.5px; font-weight:600; color:var(--c);}
  body.dark .cal-item-mat{color:var(--ink-soft);}
  .cal-item-tar{font-size:15px; font-weight:700;}

  /* ===== Celular: home mais completa, espelhando o computador ===== */
  @media (max-width:600px){
    .drive-block{padding:20px 14px 18px; border-radius:6px; margin-top:0;}
    .drive-head{gap:12px;}
    .drive-badge{width:42px; height:42px; border-radius:6px;}
    .drive-badge svg{width:21px; height:21px;}
    .drive-block .section-title{margin-bottom:16px;}
    .drive-block .section-title .st-desc{font-size:13.5px;}
    .drive-block .grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
    .drive-block .card{padding:13px 12px; gap:8px;}
    .drive-block .card .name{font-size:14.5px;}
    .drive-tag span{display:none;}
    .drive-block .drive-icon{width:22px; height:22px;}
    .card .idx{font-size:11px; padding:3px 7px;}
    .drive-folders{display:none;}
    .drive-block .card .drive-tag{display:none;}
    .card .open{font-size:12px;}
    .drive-block + div + .home-section{margin-top:36px;}

    .quick-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px;}
    .quick-card{flex-direction:column; align-items:flex-start; padding:14px 13px; gap:9px;}
    .quick-card .qc-icon{width:34px; height:34px; border-radius:9px;}
    .quick-card .qc-icon svg{width:18px; height:18px;}
    .quick-card strong{font-size:14.5px;}
    .quick-card span.qc-desc{font-size:12px; line-height:1.4;}
    .quick-card .qc-go{display:none;}

    .home-section{margin-top:44px;}
    .section-title h2{font-size:23px;}
    .entry{gap:12px; padding:14px;}
    .entry-body p{font-size:14px;}
    .stats-strip{grid-template-columns:repeat(3, minmax(0,1fr));}
    .stat-chip{padding:14px 10px;}
    .stat-num{font-size:20px;}
    .stat-label{font-size:11px;}

    .cal-card{padding:12px 8px;}
    .cal-weekdays, .cal-grid{gap:3px;}
    .cal-weekdays span{font-size:10px;}
    .cal-day{min-height:50px; padding:5px 3px; align-items:center; border-radius:8px;}
    .cal-chips{display:none;}
    .cal-dots{display:flex; justify-content:center;}
    .cal-num{font-size:12.5px;}
    .cal-day.hoje .cal-num{width:22px; height:22px;}
    .cal-month{font-size:16px;}
    .cal-item-tar{font-size:14px;}
  }

  /* títulos dos acordeões quebram linha direito no celular */
  .graveyard summary{display:block; position:relative; padding-right:46px; line-height:1.6;}
  .graveyard summary::after{position:absolute; right:20px; top:50%; margin-top:-7px;}
  .graveyard summary strong{display:inline-block; margin-right:6px; vertical-align:1px;}

  /* ===== Botão de destaque secundário (Calendário) ===== */
  .btn-accent{background:var(--petrol-soft); color:var(--petrol); border-color:var(--petrol-line);}
  .btn-accent:hover{background:var(--petrol-line); transform:translateY(-1px);}
  .drive-all{
    display:inline-flex; align-items:center; gap:8px; margin-top:18px;
    font-size:14px; font-weight:600; color:var(--petrol); text-decoration:none;
  }
  .drive-all svg{width:16px; height:16px;}
  .drive-all:hover{text-decoration:underline;}

  /* ===== Extras ===== */
  .extras-index{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
  .extras-index button{
    font-size:14px; font-weight:600; padding:9px 15px; border-radius:999px; cursor:pointer;
    border:1px solid var(--rule); background:var(--paper); color:var(--ink);
  }
  .extras-index button:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .ex-section{scroll-margin-top:calc(var(--nav-h) + 20px); margin-bottom:48px;}
  .gl-card{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:18px; box-shadow:0 10px 30px var(--shadow);}
  .gl-search{
    width:100%; font:inherit; font-size:15px; padding:12px 14px;
    border:1px solid var(--rule); border-radius:6px; background:var(--paper-alt); color:var(--ink);
  }
  .gl-search:focus{outline:2px solid var(--petrol-line); border-color:var(--petrol); background:var(--paper);}
  .gl-filtros{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px;}
  .gl-filtros .apx-chip{font-size:12.5px; padding:6px 11px;}
  .gl-count{font-size:12.5px; color:var(--ink-faint); margin:8px 0 10px;}
  .gl-list{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; max-height:620px; overflow-y:auto; padding-right:4px;}
  .gl-item{background:var(--paper-alt); border-radius:6px; padding:13px 14px;}
  .gl-top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 10px; margin-bottom:5px;}
  .gl-top strong{font-size:15px; font-weight:700;}
  .gl-tag{font-size:11px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); padding:2px 8px; border-radius:6px;}
  .gl-item p{margin:0; font-size:14px; line-height:1.55; color:var(--ink-soft);}

  .abnt-card .apx-h:first-of-type{margin-top:20px;}
  .abnt-tip{background:var(--ochre-soft); border-radius:6px; padding:12px 14px; font-size:14px; line-height:1.6;}
  .abnt-ex{
    background:var(--paper-alt); border-left:3px solid var(--petrol); border-radius:8px;
    padding:10px 14px; margin-top:8px; font-size:14.5px; line-height:1.6;
  }
  .abnt-long{margin-left:clamp(12px, 8%, 60px); font-size:13px; line-height:1.4;}
  .abnt-card code{background:var(--paper-alt); border:1px solid var(--rule); padding:1px 6px; border-radius:5px; font-size:13px;}
  .ref-form{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 14px; margin-top:14px;}
  .ref-field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .ref-field:has(textarea){grid-column:1 / -1;}
  .ref-field input, .ref-field textarea{
    font:inherit; font-size:14.5px; font-weight:400; color:var(--ink);
    padding:9px 11px; border:1px solid var(--rule); border-radius:8px; background:var(--paper); resize:vertical;
  }
  .ref-field input:focus, .ref-field textarea:focus{outline:2px solid var(--petrol-line); border-color:var(--petrol);}
  .ref-out-label{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 6px;}
  .ref-out{background:var(--paper-alt); border:1px dashed var(--petrol-line); border-radius:6px; padding:14px 16px; font-size:15px; line-height:1.6; word-break:break-word;}
  .ref-actions{display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:12px;}
  .ref-copied{font-size:13.5px; font-weight:600; color:var(--petrol);}

  @media (max-width:600px){
    .hero-ctas .btn{flex:1 1 100%;}
    .gl-card{padding:12px;}
    .gl-list{grid-template-columns:1fr; max-height:520px;}
    .ref-form{grid-template-columns:1fr;}
    .extras-index button{font-size:13px; padding:8px 12px;}
  }

  .extras-index button.on{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  body.dark .extras-index button.on{color:#0F1615;}
  .extras-hint{font-size:14px !important; color:var(--ink-faint) !important; margin:12px 0 0 !important;}
  .ex-section[hidden]{display:none;}

  /* Ferramentas agrupadas por disciplina */
  .tool-group{margin-top:36px;}
  .tool-group:first-of-type{margin-top:8px;}
  .tool-group-title{display:flex; align-items:center; flex-wrap:wrap; gap:10px; font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px;}
  .tg-idx{font-size:12.5px; font-weight:700; color:#fff; background:var(--petrol); padding:4px 9px; border-radius:7px;}
  body.dark .tg-idx{color:#0F1615;}
  .tg-count{font-size:13px; font-weight:500; color:var(--ink-faint); letter-spacing:0;}
  .tool-group .graveyard summary{font-weight:600;}
  @media (max-width:600px){ .tool-group-title{font-size:18px;} }

  /* =================== RECURSOS NOVOS =================== */
  .link-btn{background:none; border:none; padding:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; color:var(--petrol); text-decoration:underline; text-underline-offset:2px;}
  .link-btn:hover{color:var(--petrol-dark);}
  .prog-note{font-size:13.5px; color:var(--ink-faint); margin:16px 0 0; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center;}
  .study-list .prog-note{margin:0 0 4px;}

  /* nav: disciplinas */
  .ni-icon.ni-num{font-size:12px; font-weight:800;}
  .nav-dd-disc{min-width:320px;}

  /* busca */
  .hero-search{
    display:flex; align-items:center; gap:10px; width:100%; max-width:520px; margin-top:16px;
    background:var(--paper); border:1px solid var(--rule); border-radius:6px;
    padding:12px 14px; cursor:text; color:var(--ink-faint); font-size:15px; text-align:left;
    box-shadow:0 2px 8px var(--shadow); transition:border-color .15s ease, box-shadow .15s ease;
  }
  .hero-search:hover{border-color:var(--petrol-line); box-shadow:0 6px 16px var(--shadow-lg);}
  .hero-search svg{width:18px; height:18px; flex:none; color:var(--petrol);}
  .hero-search span{flex:1;}
  .hero-search kbd, .search-close{font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--paper-alt); border:1px solid var(--rule); border-radius:6px; padding:2px 8px;}
  .search-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(10,20,19,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; justify-content:center; align-items:flex-start; padding:9vh 16px 16px;
  }
  .search-overlay[hidden]{display:none;}
  body.search-open{overflow:hidden;}
  .search-box{
    width:100%; max-width:640px; max-height:78vh; display:flex; flex-direction:column;
    background:var(--paper); border:1px solid var(--rule); border-radius:6px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
  }
  .search-head{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--rule);}
  .search-head svg{width:20px; height:20px; color:var(--petrol); flex:none;}
  .search-head input{flex:1; min-width:0; border:none; outline:none; background:transparent; font:inherit; font-size:17px; color:var(--ink); padding:6px 0;}
  .search-head input::-webkit-search-cancel-button{display:none;}
  .search-close{cursor:pointer; padding:5px 10px;}
  .search-results{overflow-y:auto; padding:6px 8px 12px; -webkit-overflow-scrolling:touch;}
  .sr-group{font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); padding:14px 10px 6px;}
  .sr-item{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:none; border:none; border-radius:9px; padding:9px 10px; cursor:pointer; color:var(--ink);}
  .sr-item:hover, .sr-item.sel{background:var(--petrol-soft);}
  .sr-t{font-size:15px; font-weight:600; line-height:1.35;}
  .sr-s{font-size:13px; color:var(--ink-soft); line-height:1.35;}
  .sr-empty{padding:28px 16px; text-align:center; color:var(--ink-soft); font-size:14.5px;}
  @media (max-width:600px){
    .search-overlay{padding:0;}
    .search-box{max-width:none; max-height:none; height:100%; border-radius:0; border:none;}
    .hero-search kbd{display:none;}
  }

  /* cards do Drive com duas ações */
  .card-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:4px;}
  .card-drive, .card-disc{
    font:inherit; font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; text-decoration:none; text-align:center;
  }
  .card-drive{background:var(--petrol); color:#fff; border:1px solid var(--petrol);}
  body.dark .card-drive{color:#0F1615;}
  .card-drive:hover{background:var(--petrol-dark);}
  .card-disc{background:var(--petrol-soft); color:var(--petrol); border:1px solid var(--petrol-line);}
  .card-disc:hover{background:var(--paper); border-color:var(--petrol);}
  .name-link{font:inherit; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:inherit;}
  .name-link:hover{color:var(--petrol); text-decoration:underline; text-underline-offset:3px;}
  .drive-block .card:hover{transform:none;}
  @media (max-width:600px){
    .card-actions{flex-direction:column; gap:6px;}
    .card-drive, .card-disc{font-size:12px; padding:8px 6px;}
  }

  /* atualizações recolhidas */
  .feed-details > summary{list-style:none; cursor:pointer; margin-bottom:0;}
  .feed-details > summary::-webkit-details-marker{display:none;}
  .feed-details[open] > summary{margin-bottom:24px;}
  .feed-details > summary{align-items:center;}
  .feed-toggle{flex:none; font-size:14px; font-weight:600; color:var(--petrol); background:var(--petrol-soft); border:1px solid var(--petrol-line); padding:8px 14px; border-radius:6px; white-space:nowrap;}
  .feed-details > summary:hover .feed-toggle{border-color:var(--petrol);}
  .feed-details .ft-fechar, .feed-details[open] .ft-abrir{display:none;}
  .feed-details[open] .ft-fechar{display:inline;}
  .feed-details[open] .ft-seta{display:inline-block; transform:rotate(180deg);}

  /* atualizações clicáveis */
  .entry.has-link{cursor:pointer; transition:background .15s ease;}
  .entry.has-link:hover{background:var(--paper-alt);}
  .entry-go{flex:none; align-self:center; font-size:13.5px; font-weight:600; color:var(--petrol); white-space:nowrap;}

  /* agenda (.ics) */
  .ics-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin:0 0 16px;}
  .ics-help{font-size:12.5px; color:var(--ink-faint); line-height:1.5; flex:1 1 280px;}

  /* resumos com progresso */
  .study-actions{display:flex; flex-direction:column; align-items:stretch; gap:8px; flex:none;}
  .study-actions .study-go{text-align:center; text-decoration:none;}
  .study-done{font:inherit; font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px; cursor:pointer; background:var(--paper); color:var(--ink-soft); border:1px solid var(--rule); white-space:nowrap;}
  .study-done:hover{border-color:var(--petrol-line); color:var(--petrol);}
  .study-card.done{border-color:var(--petrol-line);}
  .study-card.done .study-done{background:var(--petrol-soft); color:var(--petrol); border-color:var(--petrol-line);}
  .study-card:hover{transform:none;}
  @media (max-width:600px){ .study-actions{flex-direction:row; width:100%;} .study-actions > *{flex:1;} }

  /* exercícios: selo de acertos */
  .tool-tipo{display:inline-block; margin-left:8px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:6px; vertical-align:1px; border:1px solid var(--rule); color:var(--ink-soft); background:var(--paper-alt);}
  .tool-tipo.interativo{color:var(--ochre); border-color:transparent; background:var(--ochre-soft);}
  .dp-tile .tool-tipo{margin:0 0 6px; align-self:flex-start;}
  .tool-prog{display:inline-block; margin-left:8px; font-size:12px; font-weight:700; color:var(--petrol); background:var(--petrol-soft); padding:2px 8px; border-radius:999px; vertical-align:1px;}

  /* vídeos leves */
  .video-lite{position:absolute; inset:0; width:100%; height:100%; padding:0; border:none; cursor:pointer; background:#000; display:block;}
  .video-lite img{width:100%; height:100%; object-fit:cover; display:block; opacity:.92;}
  .video-lite .vl-play{position:absolute; left:50%; top:50%; width:62px; height:44px; margin:-22px 0 0 -31px; border-radius:6px; background:rgba(20,33,31,.85); color:#fff; display:flex; align-items:center; justify-content:center; transition:background .15s ease, transform .15s ease;}

  /* modo prova */
  .modo-prova{margin:0 0 28px;}

  .mp-intro{font-size:15px; color:var(--ink-soft); margin-bottom:12px;}

  .mp-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:14px;}
  .mp-card{background:var(--ochre-soft); border:1px solid rgba(183,121,31,.3); border-radius:6px; padding:18px 18px 16px;}

  body.dark .mp-badge{color:#0F1615;}
  .mp-when{font-size:13.5px; font-weight:700; color:var(--ochre);}
  .mp-title{font-size:18px; font-weight:800; letter-spacing:-0.015em; margin:10px 0 12px; line-height:1.3;}
  .mp-discs{display:flex; flex-direction:column; gap:8px;}
  .mp-disc{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; text-align:left; width:100%; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:11px 13px; cursor:pointer; color:var(--ink);}
