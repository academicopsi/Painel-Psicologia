    if(!confirm(`Remover ${exhSigla(st, st.ativo)} e todas as marcações dele deste aparelho?`)) return;
    st.ps.splice(st.ativo, 1); st.ativo = Math.max(0, st.ativo - 1); exhSave(st); exhRefazer(); return; }
  if(e.target.closest('[data-exh-limpar]')){ const st = exhLoad(); const pa = st.ps[st.ativo];
    if(!confirm(`Apagar as marcações e anotações de ${exhSigla(st, st.ativo)} deste aparelho?`)) return;
    pa.r = {}; pa.alvo = null; pa.q = []; exhSave(st); exhRefazer(); return; }
  const cp = e.target.closest('[data-exh-copiar]');
  if(cp){
    const st = exhLoad(); const tipo = cp.dataset.exhCopiar; const t = exhTSV(st, tipo); const html = exhTabelaRica(st, tipo);
    const rot = cp.textContent;
    const ok = ()=>{ cp.textContent = 'Copiado ✓'; setTimeout(()=> cp.textContent = rot, 1800); };
    const simples = ()=> navigator.clipboard.writeText(t).then(ok, ()=> prompt('Copie a tabela:', t));
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([t], {type:'text/plain'})})]).then(ok, simples);
    } else if(navigator.clipboard) simples(); else prompt('Copie a tabela:', t);
    return;
  }
  if(e.target.closest('[data-exh-imprimir]')){
    const st = exhLoad(); const f = st.f;
    const idx = st.ps.map((p,i)=> i).filter(i=> exhCalc(st.ps[i]).registradas);
    if(!idx.length){ alert('Marque as respostas na folha antes de imprimir.'); return; }
    const inc = idx.filter(i=> exhCalc(st.ps[i]).registradas < 40);
    if(inc.length && !confirm(`${inc.map(i=> exhSigla(st, i)).join(', ')} ainda não tem os 40 verbos registrados. Imprimir mesmo assim?`)) return;
    const linha = (r, v)=> `<tr><th>${r}</th><td>${escHTML(v || '')}</td></tr>`;
    const w = window.open('', '_blank'); if(!w){ alert('Libere as janelas pop-up deste site para imprimir.'); return; }
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Graficos - ${escHTML(f.nome || 'Trabalho N2')}</title><style>
      body{font-family:Arial,Helvetica,sans-serif; color:#111; margin:24px;} table.cab{border-collapse:collapse; margin-bottom:16px; font-size:13px;}
      .cab th{text-align:left; padding:3px 12px 3px 0; font-weight:bold;} .cab td{padding:3px 0;}
      h2{font-size:13px; margin:12px 0 5px; padding-bottom:3px; border-bottom:1px solid #ccc;}
      table.mt{border-collapse:collapse; font-size:10.5px;} .tabs{display:flex; flex-wrap:wrap; gap:4px 28px; align-items:flex-start;} .mt th,.mt td{border:1px solid #d9d8d4; padding:2px 8px; text-align:center;} .mt th{background:#f5f4f0; font-weight:600; color:#222;} .mt tbody tr:nth-child(even) td{background:#fbfbf9;}
      .mt td:first-child{text-align:left;} .mt .sp{border:none; background:none; width:12px; padding:0;} .mt tr.tot td{font-weight:bold;}
      .graf{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;} .graf svg{width:100%; max-width:680px; border:1px solid #e4e3df; border-radius:8px; break-inside:avoid; page-break-inside:avoid;}
      .sec{break-inside:avoid; page-break-inside:avoid;} @page{margin:12mm;}</style></head><body>
      <table class="cab">${linha('Nome completo:', f.nome)}${linha('Matrícula:', f.mat)}${linha('Disciplina:', f.disc)}${linha('Unidade:', f.uni)}${linha('Data de entrega:', f.entrega)}</table>
      <div class="tabs"><div class="sec"><h2>Frequencia Absoluta</h2>${exhAbsModeloHTML(st, idx)}</div>
      <div class="sec"><h2>Comparativo LB-INT</h2>${exhCompModeloHTML(st, idx)}</div></div>
      <div class="sec"><h2>Frequencia Relativa</h2>${exhRelModeloHTML(st, idx)}</div>
      <div class="graf">${idx.map(i=> exhGraficoModelo(st.ps[i], exhTitulo(st, i))).join('')}</div>
      <script>window.onload = function(){ window.print(); };<\/script></body></html>`);
    w.document.close();
  }
});
document.getElementById('discPage').addEventListener('input', e=>{
  const fi = e.target.closest('[data-exh-f]');
  if(fi){ const st = exhLoad(); st.f[fi.dataset.exhF] = fi.value; exhSave(st); return; }
  const pf = e.target.closest('[data-exh-pf]');
  if(pf){ const st = exhLoad(); st.ps[st.ativo][pf.dataset.exhPf] = pf.value; exhSave(st); return; }
  const q = e.target.closest('[data-exh-q]');
  if(q){ const st = exhLoad(); const pa = st.ps[st.ativo]; pa.q = pa.q || []; pa.q[+q.dataset.exhQ] = q.value; exhSave(st); }
});

document.getElementById('discPage').addEventListener('change', e=>{ if(e.target.closest('[data-exh-pf="part"]')) exhRefazer(); });

document.getElementById('discPage').innerHTML = exhHTML();
document.getElementById('exh').open = true;

  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  async function abrir(seq){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(seq), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const js = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.n)}, k, b64(P.c)));
    const sc = document.createElement('script'); sc.textContent = js; document.body.appendChild(sc);
  }
  let salvo = null; try{ salvo = localStorage.getItem(LS); }catch(_){}
  if(salvo) abrir(salvo).catch(() => { try{ localStorage.removeItem(LS); }catch(_){} });
  // 5 toques rápidos no "Arquivo Vivo · prévia" abrem o teclado secreto
  let toques = [], seq = '';
  const topo = document.querySelector('.prev-top'); if(!topo) return;
  topo.style.userSelect = 'none'; topo.style.webkitUserSelect = 'none';
  topo.addEventListener('click', () => { const t = Date.now(); toques = toques.filter(x => t - x < 2500); toques.push(t); if(toques.length >= 5){ toques = []; teclado(); } });
  function teclado(){
    if(document.getElementById('abntTec')) return; seq = '';
    const d = document.createElement('div'); d.id = 'abntTec';
    d.innerHTML = '<div class="tec-c"><div class="tec-pts"></div><div class="tec-g">' + PR.map((p, i) => '<button type="button" data-t="' + i + '">' + p + '</button>').join('') + '</div><button type="button" class="tec-x">Fechar</button></div>';

    const st = document.createElement('style'); st.textContent = '#abntTec .tec-c{background:#fff;border-radius:18px;padding:18px;width:min(320px,calc(100vw - 40px));box-shadow:0 10px 30px rgba(0,0,0,.2)} #abntTec .tec-pts{display:flex;justify-content:center;gap:8px;height:14px;margin:2px 0 14px} #abntTec .tec-pts i{width:10px;height:10px;border-radius:50%;background:#1F5C56} #abntTec .tec-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} #abntTec .tec-g button{font:600 14px Inter,system-ui,sans-serif;padding:14px 4px;border:1px solid #DFE6E4;border-radius:12px;background:#F0F4F3;color:#14211F;cursor:pointer} #abntTec .tec-x{margin-top:12px;width:100%;font:13px Inter,system-ui,sans-serif;background:none;border:0;color:#5B6A67;cursor:pointer}';
    d.appendChild(st); document.body.appendChild(d);
    const pts = d.querySelector('.tec-pts');
    d.addEventListener('click', async e => {
      if(e.target === d || e.target.closest('.tec-x')){ d.remove(); return; }
      const b = e.target.closest('[data-t]'); if(!b) return;
      seq += b.dataset.t; pts.innerHTML = '<i></i>'.repeat(seq.length);
      if(seq.length < 8) return;
      try{ await abrir(seq); try{ localStorage.setItem(LS, seq); }catch(_){} d.remove(); const bl = document.getElementById('abntBloco'); if(bl) bl.scrollIntoView({behavior:'smooth', block:'center'}); }
      catch(_){ seq = ''; pts.innerHTML = ''; d.querySelector('.tec-c').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}], {duration:240}); }
    });
  }
