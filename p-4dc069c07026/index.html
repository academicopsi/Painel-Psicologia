<main class="prev-wrap">
  <div class="prev-top">Arquivo Vivo · prévia</div>
  <h1 style="font-family:Lora,serif; margin:0;">Trabalho com humanos: reforço do pronome EU ou NÓS</h1>
  <p class="prev-aviso">Página de prévia, fora do site e acessível só por este link, para avaliação antes de qualquer publicação. Ela não aparece no Arquivo Vivo nem em buscadores.</p>
  <div id="discPage"></div>
</main>
<script>
function escHTML(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const EXH = {
  disc: '04',
  verbos: ['Representar','Mandar','Gostar','Lembrar','Indicar','Favorecer','Defender','Estudar','Verificar','Esperar',
    'Escrever','Relatar','Aconselhar','Convidar','Plantar','Falar','Precisar','Buscar','Desenhar','Experimentar',
    'Andar','Rodar','Enganar','Voltar','Vender','Acabar','Administrar','Ajudar','Parar','Apresentar',
    'Fabricar','Tratar','Telefonar','Chamar','Continuar','Entender','Derrubar','Contar','Confirmar','Desmontar'],
  pronomes: ['Eu','Tu','Ele/Ela','Nós','Vós','Eles/Elas'],
  pptx: 'experimento-pronomes-40-slides.pptx',
  pasta: 'https://drive.google.com/drive/folders/162RsDUEGxxKyT1Z3Dr-Xb9-SuF1xzj2F',
  passos: [
    {t:'Antes de começar', itens:[
      'O trabalho é individual. Você é o experimentador e escolhe uma pessoa para ser o participante.',
      'O participante não pode ser aluno de Psicologia nem ter menos de 10 anos.',
      'Prepare a apresentação com 40 slides: um verbo por slide e a lista de pronomes (Eu, Tu, Ele/Ela, Nós, Vós, Eles/Elas). O PowerPoint pronto está logo acima.',
      'Sente-se ao lado do participante, controlando a passagem dos slides. Se for on-line, prefira o Google Meet, com a tela compartilhada.',
      'Tenha a folha de registro em mãos (de papel ou a digital, mais abaixo).']},
    {t:'Cuidados éticos', itens:[
      'Conte ao participante que é um trabalho da disciplina e que serve para os alunos aprenderem conceitos básicos de análise experimental do comportamento. Diga o nome da disciplina, da professora e da faculdade.',
      'Avise que ele pode interromper a qualquer momento, sem nenhum prejuízo.',
      'Só comece se ele concordar.']},
    {t:'Instrução padronizada (leia exatamente)', fala:true, itens:[
      '"O propósito deste experimento é verificar como as pessoas constroem frases e ele não envolve avaliação de inteligência ou de personalidade. Vou mostrar a você slides contendo, cada um, um verbo no infinitivo e uma lista de pronomes. Diga em voz alta uma frase que comece com um dos pronomes e contenha o verbo em questão. Você pode usar o verbo em qualquer tempo. Não importa que a frase seja longa ou curta, verdadeira ou falsa, simples ou complexa. Inicialmente você pode achar a tarefa difícil, mas logo ela parecerá mais fácil, portanto, não desanime. Você entendeu?"',
      'Ao terminar a leitura, pergunte se ele entendeu. Só continue se a resposta for sim.',
      'Se ele pedir mais explicações, apenas leia a instrução de novo, sem comentar nada. Assim todos os participantes recebem a mesma instrução.',
      'Se ele fizer perguntas durante a tarefa, ou disser uma frase sem pronome ou sem o verbo, interrompa e diga: "Lembre-se de que você deve construir uma frase que comece com um dos pronomes deste slide e que utilize o verbo em questão. Você pode usar o verbo em qualquer tempo. Não importa que a frase seja longa ou curta, verdadeira ou falsa, simples ou complexa."']},
    {t:'Fase I: linha de base (verbos 1 a 10)', itens:[
      'As duas fases são aplicadas uma seguida da outra, numa única sessão.',
      'Do Representar ao Esperar, não reforce nada, qualquer que seja o pronome.',
      'Só registre o pronome usado e passe para o próximo slide quando ele terminar a frase.']},
    {t:'Fase II: intervenção, com reforço (verbos 11 a 40)', itens:[
      'A partir do Escrever (11º verbo), reforce só UM pronome: EU ou NÓS. Nunca os dois.',
      'O pronome escolhido precisa ter aparecido pelo menos 2 vezes na Fase I.',
      'Reforce sempre que ele terminar uma frase com o pronome escolhido, com "Certo", "Muito bem", "Ótimo" ou "Muito bom", variando ao acaso, de forma natural e aprovadora.',
      'Elogie só depois que a frase terminar. Elogiar no meio dá uma "dica" do que está sendo reforçado.',
      'Cuidado para não reforçar sem querer os outros pronomes com sorriso, olhar de aprovação ou aceno de cabeça.']},
    {t:'Como registrar', itens:[
      'Marque um X no pronome usado em cada verbo.',
      'Se não usar pronome ou não usar o verbo, risque a linha daquela tentativa (na folha digital: "Anular").',
      'Se ele errar e se corrigir, ou trocar de pronome logo em seguida, anote a segunda resposta.',
      'No fim, anote seu nome, a data e uma sigla para o participante (por exemplo, P1).']},
    {t:'Depois do experimento', itens:[
      'Agradeça e diga que o experimento terminou.',
      'Pergunte e anote as respostas no verso da folha: 1) O que você achou do experimento? 2) Como você construiu suas frases? Você se baseou em algum critério? Qual ou quais? 3) O que levou você a escolher este ou aquele pronome?']},
    {t:'O que entregar', itens:[
      'Um gráfico de frequência relativa (%) impresso, com nome completo, matrícula, nome da disciplina, unidade e data de entrega.',
      'Nos vídeos da pasta, a planilha tem três abas: Frequência absoluta (quantas vezes cada pronome apareceu na linha de base e na intervenção), Frequência relativa (frequência absoluta × 100 ÷ 10 na LB e ÷ 30 na INT) e Comparativo LB-INT.',
      'O gráfico dos vídeos é de colunas: os pronomes no eixo horizontal, a frequência relativa no vertical, uma coluna para LB e outra para INT, e o título com o participante e o pronome reforçado (por exemplo, "P1 - Nós").',
      'A folha digital abaixo faz as mesmas contas e o mesmo gráfico, e copia as tabelas para você colar na planilha.']},
  ],
};

function exhNorm(st){
  st = st || {}; st.f = st.f || {};
  if(!Array.isArray(st.ps) || !st.ps.length){
    const f = st.f;
    st.ps = [{r: st.r || {}, alvo: st.alvo || null, q: st.q || [], part: f.part || '', sexo: f.sexo || '', idade: f.idade || '', data: f.data || ''}];
  }
  delete st.r; delete st.alvo; delete st.q;
  st.ativo = Math.max(0, Math.min(st.ativo || 0, st.ps.length - 1));
  return st;
}
function exhLoad(){ let o = {}; try{ o = JSON.parse(localStorage.getItem('av-experimento')) || {}; }catch(e){} return exhNorm(o); }
function exhSave(o){ try{ localStorage.setItem('av-experimento', JSON.stringify(o)); }catch(e){} }
const EXH_MAX = 6;
function exhSigla(st, i){ return String(st.ps[i].part || '').trim() || ('P' + (i+1)); }
function exhTitulo(st, i){ const k = exhCalc(st.ps[i]); return `${exhSigla(st, i)} - ${k.alvo >= 0 ? EXH.pronomes[k.alvo] : '?'}`; }
function exhCalc(p){
  const r = (p && p.r) || {}; const P = EXH.pronomes;
  const fase = (ini, fim)=>{ const c = P.map(()=>0); let validas = 0, anuladas = 0;
    for(let i=ini;i<fim;i++){ const v = r[i]; if(v === 'x') anuladas++; else if(v != null){ c[v]++; validas++; } }
    return {c, validas, anuladas, pct: c.map(n=> n*100/(fim-ini))}; };
  const lb = fase(0,10), rf = fase(10,40);
  const alvo = p && p.alvo === 'Nós' ? 3 : p && p.alvo === 'Eu' ? 0 : -1;
  const registradas = Object.keys(r).length;
  return {lb, rf, alvo, registradas};
}
const exhFmt = n => (Math.round(n*10)/10).toLocaleString('pt-BR');
function exhGrafico(p, sigla){
  const W = 680, H = 380, L = 54, R = 20, T = 92, B = 54, ph = H-T-B, pw = W-L-R;
  const k_ = exhCalc(p); const P = EXH.pronomes;
  const y = v => T + ph - v/100*ph;
  const LB = '#B9C4CC', INT = '#1F5C56', TX = '#1B2422', SUB = '#5E6B68', GRID = '#E7E9E8';
  const fonte = `font-family="Inter, 'Helvetica Neue', Arial, sans-serif"`;
  let g = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" class="exh-svg" role="img" ${fonte}>`;
  g += `<rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  const titulo = `${sigla} - ${k_.alvo >= 0 ? P[k_.alvo] : 'pronome reforçado'}`;
  g += `<text x="${L-30}" y="30" font-size="18" font-weight="700" fill="${TX}">${escHTML(titulo)}</text>`;
  g += `<text x="${L-30}" y="51" font-size="12.5" fill="${SUB}">Frequência relativa de cada pronome na linha de base (LB) e na intervenção (INT)</text>`;
  g += `<rect x="${L-30}" y="64" width="11" height="11" rx="2" fill="${LB}"/><text x="${L-14}" y="74" font-size="12" fill="${TX}">LB · verbos 1–10</text>`;
  g += `<rect x="${L+96}" y="64" width="11" height="11" rx="2" fill="${INT}"/><text x="${L+112}" y="74" font-size="12" fill="${TX}">INT · verbos 11–40</text>`;
  const gw = pw/6;
  if(k_.alvo >= 0) g += `<rect x="${L + gw*k_.alvo + 4}" y="${T-6}" width="${gw-8}" height="${ph+6}" rx="6" fill="#1F5C56" fill-opacity="0.06"/>`;
  for(let v=0; v<=100; v+=25){
    g += `<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? GRID : '#9AA3A1'}" stroke-width="${v ? 1 : 1.2}"/>`;
    g += `<text x="${L-10}" y="${y(v)+4}" font-size="11.5" text-anchor="end" fill="${SUB}">${v}%</text>`;
  }
  const bw = Math.min(26, gw*0.3);
  P.forEach((pr,i)=>{ const cx = L + gw*(i+0.5);
    [[k_.lb.pct[i], LB, -bw-3, SUB],[k_.rf.pct[i], INT, 3, INT]].forEach(([v,cor,dx,cl])=>{
      const h = T+ph-y(v);
      if(h > 0) g += `<path d="M${cx+dx},${T+ph} V${y(v)+3} Q${cx+dx},${y(v)} ${cx+dx+3},${y(v)} H${cx+dx+bw-3} Q${cx+dx+bw},${y(v)} ${cx+dx+bw},${y(v)+3} V${T+ph} Z" fill="${cor}"/>`;
      if(v > 0) g += `<text x="${cx+dx+bw/2}" y="${y(v)-6}" font-size="10.5" font-weight="600" text-anchor="middle" fill="${cl}">${exhFmt(v)}</text>`; });
    g += `<text x="${cx}" y="${T+ph+20}" font-size="12.5" text-anchor="middle" fill="${TX}"${i === k_.alvo ? ' font-weight="700"' : ''}>${pr}</text>`; });
  g += `<text x="${L+pw/2}" y="${H-10}" font-size="11.5" text-anchor="middle" fill="${SUB}">Pronomes</text>`;
  return g + '</svg>';
}
function exhTabelaHTML(p){
  const k = exhCalc(p); const P = EXH.pronomes;
  return `<table class="exh-tab"><thead><tr><th>Pronomes</th><th>LB<br><small>freq. abs.</small></th><th>LB<br><small>freq. rel. (%)</small></th><th>INT<br><small>freq. abs.</small></th><th>INT<br><small>freq. rel. (%)</small></th></tr></thead>
    <tbody>${P.map((pr,i)=>`<tr${i === k.alvo ? ' class="alvo"' : ''}><td>${pr}</td><td>${k.lb.c[i]}</td><td>${exhFmt(k.lb.pct[i])}</td><td>${k.rf.c[i]}</td><td>${exhFmt(k.rf.pct[i])}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${k.lb.c.reduce((a,b)=>a+b,0)}</td><td>${exhFmt(k.lb.pct.reduce((a,b)=>a+b,0))}</td><td>${k.rf.c.reduce((a,b)=>a+b,0)}</td><td>${exhFmt(k.rf.pct.reduce((a,b)=>a+b,0))}</td></tr></tfoot></table>`;
}
// Tabela no formato da aba "Comparativo LB-INT" dos vídeos: uma dupla de colunas LB/INT por participante
function exhComparativoHTML(st, tipo){
  const P = EXH.pronomes; const ks = st.ps.map(p=> exhCalc(p));
  const val = (k, fase, i)=> tipo === 'abs' ? k[fase].c[i] : exhFmt(k[fase].pct[i]);
  return `<div class="exh-folha-wrap exh-comp-wrap"><table class="exh-tab exh-comp"><thead>
    <tr><th rowspan="2">Pronomes</th>${st.ps.map((_,i)=>`<th colspan="2">${escHTML(exhTitulo(st, i))}</th>`).join('')}</tr>
    <tr>${st.ps.map(()=>'<th>LB</th><th>INT</th>').join('')}</tr></thead>
    <tbody>${P.map((pr,j)=>`<tr><td>${pr}</td>${ks.map(k=>`<td${j === k.alvo ? ' class="exh-c-alvo"' : ''}>${val(k,'lb',j)}</td><td${j === k.alvo ? ' class="exh-c-alvo"' : ''}>${val(k,'rf',j)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function exhTSV(st, tipo){
  const P = EXH.pronomes; const ks = st.ps.map(p=> exhCalc(p));
  let t = '\t' + st.ps.map((_,i)=> exhTitulo(st, i) + '\t').join('') + '\n';
  t += 'Pronomes\t' + st.ps.map(()=> 'LB\tINT').join('\t') + '\n';
  P.forEach((pr,j)=>{ t += pr + '\t' + ks.map(k=> tipo === 'abs' ? `${k.lb.c[j]}\t${k.rf.c[j]}` : `${exhFmt(k.lb.pct[j])}\t${exhFmt(k.rf.pct[j])}`).join('\t') + '\n'; });
  return t;
}
function exhFolhaHTML(){
  const st = exhLoad(); const pa = st.ps[st.ativo]; const r = pa.r || {}; const P = EXH.pronomes; const k = exhCalc(pa);
  const linha = i => `<tr class="${r[i] === 'x' ? 'anul' : ''}"><td class="exh-n">${i+1}</td><td class="exh-v">${EXH.verbos[i]}</td>${P.map((p,j)=>`<td><button type="button" class="exh-b${r[i] === j ? ' on' : ''}${i >= 10 && j === k.alvo ? ' alvo' : ''}" data-exh-r="${i}" data-exh-p="${j}" aria-label="${EXH.verbos[i]}: ${p}">${r[i] === j ? '✕' : ''}</button></td>`).join('')}<td><button type="button" class="exh-anul${r[i] === 'x' ? ' on' : ''}" data-exh-r="${i}" data-exh-p="x" title="Sem pronome ou sem o verbo: riscar a linha">Anular</button></td></tr>`;
  const cab = `<tr><th>#</th><th>Verbo</th>${P.map(p=>`<th>${p}</th>`).join('')}<th></th></tr>`;
  const lbAlvo = k.alvo >= 0 ? k.lb.c[k.alvo] : 0;
  const aviso = k.alvo >= 0 && k.lb.validas === 10 && lbAlvo < 2 ? `<p class="exh-aviso">Atenção: "${P[k.alvo]}" apareceu ${lbAlvo} ${lbAlvo === 1 ? 'vez' : 'vezes'} na Fase I. O pronome reforçado precisa ter aparecido pelo menos 2 vezes; escolha o outro${(k.lb.c[k.alvo === 0 ? 3 : 0] >= 2) ? '' : ' (se ele também não apareceu 2 vezes, confirme com a professora)'}.</p>` : '';
  const f = st.f;
  const campo = (id, rot, ph)=> `<label class="exh-campo"><span>${rot}</span><input data-exh-f="${id}" value="${escHTML(f[id] || '')}" placeholder="${ph || ''}"></label>`;
  const campoP = (id, rot, ph)=> `<label class="exh-campo"><span>${rot}</span><input data-exh-pf="${id}" value="${escHTML(pa[id] || '')}" placeholder="${ph || ''}"></label>`;
  const sigla = exhSigla(st, st.ativo);
  const abas = `<div class="exh-parts" role="tablist">${st.ps.map((p,i)=>{ const kk = exhCalc(p); return `<button type="button" role="tab" aria-selected="${i === st.ativo}" class="exh-part${i === st.ativo ? ' on' : ''}" data-exh-ativo="${i}"><strong>${escHTML(exhSigla(st, i))}</strong><span>${kk.alvo >= 0 ? P[kk.alvo] + ' · ' : ''}${kk.registradas}/40</span></button>`; }).join('')}
    ${st.ps.length < EXH_MAX ? '<button type="button" class="exh-part exh-part-add" data-exh-add>+ Participante</button>' : ''}</div>`;
  const comGraf = st.ps.map((p,i)=> exhCalc(p).registradas ? `<div class="exh-graf">${exhGrafico(p, exhSigla(st, i))}</div>` : '').join('');
  const an = k.lb.anuladas + k.rf.anuladas;
  return `
    <div class="exh-campos">${campo('exp','Experimentador')}</div>
    <p class="exh-nota" style="margin-top:0;">Aplicou com mais de uma pessoa? Use "+ Participante": cada um tem a sua folha, e o comparativo junta todos.</p>
    ${abas}
    <div class="exh-campos">${campoP('part','Participante (sigla)','P' + (st.ativo+1))}${campoP('sexo','Sexo')}${campoP('idade','Idade')}${campoP('data','Data do experimento','dd/mm/aaaa')}</div>
    <div class="exh-alvo"><span>Pronome que vou reforçar com ${escHTML(sigla)} na Fase II:</span>
      ${['Eu','Nós'].map(p=>`<button type="button" class="exh-alvo-b${pa.alvo === p ? ' on' : ''}" data-exh-alvo="${p}">${p.toUpperCase()}</button>`).join('')}
      <small>Escolha depois da Fase I: precisa ter aparecido pelo menos 2 vezes.</small></div>
    ${aviso}
    <div class="exh-folha-wrap"><table class="exh-folha">
      <thead>${cab}</thead>
      <tbody><tr class="exh-fase"><td colspan="9">Fase I · Linha de base: só registrar</td></tr>${[...Array(10)].map((_,i)=>linha(i)).join('')}
      <tr class="exh-fase"><td colspan="9">Fase II · Intervenção: reforçar ${k.alvo >= 0 ? `só o "${P[k.alvo].toUpperCase()}"` : 'o pronome escolhido'}, depois que a frase terminar</td></tr>${[...Array(30)].map((_,i)=>linha(i+10)).join('')}</tbody>
    </table></div>
    <p class="exh-prog">${escHTML(sigla)}: ${k.registradas} de 40 verbos registrados${an ? ` · ${an} anulado${an > 1 ? 's' : ''}` : ''}</p>
    <h4 class="rt-h">Perguntas depois do experimento (${escHTML(sigla)})</h4>
    ${['O que você achou do experimento?','Como você construiu suas frases? Você se baseou em algum critério? Qual ou quais?','O que levou você a escolher este ou aquele pronome?'].map((q,i)=>`<label class="exh-perg"><span>${i+1}. ${q}</span><textarea rows="2" data-exh-q="${i}">${escHTML((pa.q || [])[i] || '')}</textarea></label>`).join('')}
    <h4 class="rt-h">Resultado de ${escHTML(sigla)}</h4>
    ${exhTabelaHTML(pa)}
    ${an ? `<p class="exh-aviso">${escHTML(sigla)} tem ${an} ${an === 1 ? 'tentativa anulada' : 'tentativas anuladas'}. A conta segue o modelo dos vídeos (× 100 ÷ 10 na LB e ÷ 30 na INT), então os totais não chegam a 100%. Confirme com a professora como tratar as anuladas.</p>` : ''}
    <h4 class="rt-h">Comparativo LB-INT</h4>
    <p class="exh-nota" style="margin-top:0;">Igual à aba "Comparativo LB-INT" dos vídeos: frequência relativa (%) de cada participante, com LB e INT lado a lado, e um gráfico por participante.</p>
    ${exhComparativoHTML(st, 'rel')}
    <div class="exh-grafs">${comGraf || '<div class="exh-graf"><p class="exh-vazio">Os gráficos aparecem aqui assim que você marcar as respostas na folha.</p></div>'}</div>
    <h4 class="rt-h">Abas da planilha</h4>
    <p class="exh-nota" style="margin-top:0;">Copie cada tabela e cole na aba de mesmo nome da sua planilha (célula A1). O gráfico da planilha sai da tabela do Comparativo.</p>
    <div class="exh-acoes">
      <button type="button" class="btn" data-exh-copiar="abs">Copiar · Frequência Absoluta</button>
      <button type="button" class="btn" data-exh-copiar="rel">Copiar · Frequência Relativa</button>
      <button type="button" class="btn" data-exh-copiar="comp">Copiar · Comparativo LB-INT</button>
    </div>
    <h4 class="rt-h">Dados para o cabeçalho do gráfico</h4>
    <div class="exh-campos">${campo('nome','Nome completo')}${campo('mat','Matrícula')}${campo('disc','Disciplina','nome como aparece no seu portal')}${campo('uni','Unidade')}${campo('entrega','Data de entrega','dd/mm/aaaa')}</div>
    <div class="exh-acoes">
      <button type="button" class="btn btn-primary" data-exh-imprimir>Imprimir os gráficos</button>
      ${st.ps.length > 1 ? `<button type="button" class="link-btn exh-limpar" data-exh-remover>Remover ${escHTML(sigla)}</button>` : ''}
      <button type="button" class="link-btn exh-limpar" data-exh-limpar>Limpar a folha de ${escHTML(sigla)}</button>
    </div>
    <p class="exh-nota">Tudo fica salvo só neste aparelho. As contas e os gráficos seguem o modelo dos vídeos da pasta: frequência relativa = frequência absoluta × 100 ÷ 10 na linha de base (LB) e ÷ 30 na intervenção (INT), e gráfico de colunas LB × INT por pronome.</p>`;
}
function exhResumoTexto(st){ return st.ps.map((p,i)=> `${exhSigla(st, i)}: ${exhCalc(p).registradas} de 40`).join(' · '); }
function exhHTML(){
  const st = exhLoad();
  return `<details class="rt-box" id="exh" data-exh>
    <summary class="rt-sum"><span class="rt-sum-t">Trabalho com humanos: reforço do pronome EU ou NÓS</span><span class="rt-sum-s">Passo a passo, folha de registro digital e comparativo LB × INT · ${escHTML(exhResumoTexto(st))}</span><span class="rt-sum-go">Abrir</span></summary>
    <div class="rt">
      <div class="rt-head">
        <p class="rt-intro">Experimento individual baseado na Prática 16 de Matos e Tomanari (2002), <em>A análise do comportamento no laboratório</em>, adaptada pela disciplina. O objetivo é ver o efeito de reforçar diferencialmente um pronome (EU ou NÓS) na construção de frases: 10 verbos de linha de base e 30 com reforço.</p>
        <div class="exh-mat">
          <a class="btn" href="${EXH.pptx}" download>Baixar o PowerPoint (40 slides)</a>
          <a class="btn" href="${EXH.pasta}" target="_blank" rel="noopener">Pasta da explicação no Drive ↗</a>
        </div>
      </div>
      ${EXH.passos.map((p, i)=>`<details class="graveyard rt-q"><summary><span class="rt-qt">${i+1}. ${escHTML(p.t)}</span></summary><div class="rt-body"><ul class="${p.fala ? 'exh-fala' : 'rt-pede'}">${p.itens.map(x=>`<li>${escHTML(x)}</li>`).join('')}</ul></div></details>`).join('')}
      <details class="graveyard rt-q" open><summary><span class="rt-qt">Folha de registro digital e comparativo</span></summary><div class="rt-body" id="exhFolha">${exhFolhaHTML()}</div></details>
    </div>
  </details>`;
}
function exhRefazer(){ const el = document.getElementById('exhFolha'); if(el){ const sy = window.scrollY; el.innerHTML = exhFolhaHTML(); window.scrollTo(0, sy); }
  const s = document.querySelector('#exh .rt-sum-s'); if(s) s.textContent = `Passo a passo, folha de registro digital e comparativo LB × INT · ${exhResumoTexto(exhLoad())}`; }
document.getElementById('discPage').addEventListener('click', e=>{
  const b = e.target.closest('[data-exh-r]');
  if(b){ const st = exhLoad(); const pa = st.ps[st.ativo]; pa.r = pa.r || {}; const i = +b.dataset.exhR; const v = b.dataset.exhP === 'x' ? 'x' : +b.dataset.exhP;
    if(pa.r[i] === v) delete pa.r[i]; else pa.r[i] = v; exhSave(st); exhRefazer(); return; }
  const a = e.target.closest('[data-exh-alvo]');
  if(a){ const st = exhLoad(); const pa = st.ps[st.ativo]; pa.alvo = pa.alvo === a.dataset.exhAlvo ? null : a.dataset.exhAlvo; exhSave(st); exhRefazer(); return; }
  const at = e.target.closest('[data-exh-ativo]');
  if(at){ const st = exhLoad(); st.ativo = +at.dataset.exhAtivo; exhSave(st); exhRefazer(); return; }
  if(e.target.closest('[data-exh-add]')){ const st = exhLoad(); if(st.ps.length >= EXH_MAX) return; st.ps.push({r:{}, alvo:null, q:[], part:'', sexo:'', idade:'', data:''}); st.ativo = st.ps.length - 1; exhSave(st); exhRefazer(); return; }
  if(e.target.closest('[data-exh-remover]')){ const st = exhLoad(); if(st.ps.length < 2) return;
    if(!confirm(`Remover ${exhSigla(st, st.ativo)} e todas as marcações dele deste aparelho?`)) return;
    st.ps.splice(st.ativo, 1); st.ativo = Math.max(0, st.ativo - 1); exhSave(st); exhRefazer(); return; }
  if(e.target.closest('[data-exh-limpar]')){ const st = exhLoad(); const pa = st.ps[st.ativo];
    if(!confirm(`Apagar as marcações e anotações de ${exhSigla(st, st.ativo)} deste aparelho?`)) return;
    pa.r = {}; pa.alvo = null; pa.q = []; exhSave(st); exhRefazer(); return; }
  const cp = e.target.closest('[data-exh-copiar]');
  if(cp){
    const st = exhLoad(); const tipo = cp.dataset.exhCopiar; const t = exhTSV(st, tipo === 'abs' ? 'abs' : 'rel');
    const rot = cp.textContent;
    const ok = ()=>{ cp.textContent = 'Copiado ✓'; setTimeout(()=> cp.textContent = rot, 1800); };
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(ok, ()=> prompt('Copie a tabela:', t)); else prompt('Copie a tabela:', t);
    return;
  }
  if(e.target.closest('[data-exh-imprimir]')){
    const st = exhLoad(); const f = st.f;
    const idx = st.ps.map((p,i)=> i).filter(i=> exhCalc(st.ps[i]).registradas);
    if(!idx.length){ alert('Marque as respostas na folha antes de imprimir.'); return; }
    const inc = idx.filter(i=> exhCalc(st.ps[i]).registradas < 40);
    if(inc.length && !confirm(`${inc.map(i=> exhSigla(st, i)).join(', ')} ainda não tem os 40 verbos registrados. Imprimir mesmo assim?`)) return;
    const linha = (r, v)=> `<tr><th>${r}</th><td>${escHTML(v || '')}</td></tr>`;
    const w = window.open('', '_blank'); if(!w){ alert('Libere as janelas pop-up deste site para imprimir.'); return; }
    w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Comparativo LB-INT</title><style>
      body{font-family:Arial,Helvetica,sans-serif; color:#111; margin:24px;} table.cab{border-collapse:collapse; margin-bottom:18px; font-size:13px;}
      .cab th{text-align:left; padding:3px 12px 3px 0; font-weight:bold;} .cab td{padding:3px 0;} svg{width:100%; max-width:680px; display:block; margin:0 auto 10px;}
      .g{break-inside:avoid; page-break-inside:avoid; margin-bottom:14px;}
      table.exh-tab{border-collapse:collapse; font-size:12px; margin-top:12px;} .exh-tab th,.exh-tab td{border:1px solid #999; padding:4px 8px; text-align:center;} .exh-c-alvo{font-weight:bold;}
      p{font-size:12px;} @page{margin:14mm;}</style></head><body>
      <table class="cab">${linha('Nome completo:', f.nome)}${linha('Matrícula:', f.mat)}${linha('Disciplina:', f.disc)}${linha('Unidade:', f.uni)}${linha('Data de entrega:', f.entrega)}</table>
      ${idx.map(i=> `<div class="g">${exhGrafico(st.ps[i], exhSigla(st, i))}</div>`).join('')}
      ${exhComparativoHTML({ps: idx.map(i=> st.ps[i]).map((p,j)=> Object.assign({}, p, {part: exhSigla(st, idx[j])}))}, 'rel')}
      <p>LB: linha de base (verbos 1 a 10). INT: intervenção, com reforço (verbos 11 a 40). Frequência relativa = frequência absoluta × 100 ÷ 10 (LB) ou ÷ 30 (INT).</p>
      <script>window.onload = function(){ window.print(); };<\/script></body></html>`);
    w.document.close();
  }
});
document.getElementById('discPage').addEventListener('input', e=>{
  const fi = e.target.closest('[data-exh-f]');
  if(fi){ const st = exhLoad(); st.f[fi.dataset.exhF] = fi.value; exhSave(st); return; }
  const pf = e.target.closest('[data-exh-pf]');
  if(pf){ const st = exhLoad(); st.ps[st.ativo][pf.dataset.exhPf] = pf.value; exhSave(st); return; }
  const q = e.target.closest('[data-exh-q]');
  if(q){ const st = exhLoad(); const pa = st.ps[st.ativo]; pa.q = pa.q || []; pa.q[+q.dataset.exhQ] = q.value; exhSave(st); }
});
// a sigla do participante muda títulos e abas: redesenha ao sair do campo
document.getElementById('discPage').addEventListener('change', e=>{ if(e.target.closest('[data-exh-pf="part"]')) exhRefazer(); });

document.getElementById('discPage').innerHTML = exhHTML();
document.getElementById('exh').open = true;
</script>
