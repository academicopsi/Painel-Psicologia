name: Mural (notificações)

on:
  schedule:
    - cron: '*/5 * * * *'   # reserva: o GitHub atrasa muito os agendamentos; o disparo confiável vem do cron-job.org (ver _firebase/LEIA-ME-avisos.md)
  workflow_dispatch:

concurrency:
  group: mural-push
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - name: Enviar respostas e marcações
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: MODO=mural node .github/scripts/notificar.mjs
