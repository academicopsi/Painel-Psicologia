name: Mural (notificações)

on:
  schedule:
    - cron: '*/5 * * * *'   # reserva: o GitHub atrasa muito os agendamentos; o disparo confiável vem do cron-job.org (ver _firebase/LEIA-ME-avisos.md)
  workflow_dispatch:

concurrency:
  group: mural-push
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - name: Enviar respostas e marcações
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: MODO=mural node .github/scripts/notificar.mjs

  # Virada de 26/11/2026 às 10:00 (Brasília): a V3 vira o site oficial, sem /v3.
  # Aproveita o disparo a cada 5 minutos do cron-job.org. Depois de feita, não faz mais nada.
  virada:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: virada
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: python3 .github/scripts/virada.py
      - if: steps.v.outputs.feita == '1'
        name: Publicar
        run: |
          git config user.name academicopsi
          git config user.email academicopsi@users.noreply.github.com
          git add -A
          git commit -m "Virada: a V3 vira o site oficial"
          git pull --rebase origin main
          git push origin HEAD:main
