name: Números da turma

on:
  schedule:
    - cron: '17 7 * * *'   # todo dia às 4h17 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['notificacoes/atualizar-numeros.txt']

jobs:
  calcular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - name: Calcular
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/estatisticas.mjs
