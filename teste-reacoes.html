<style>

  @keyframes rSobe{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .r-lado{animation:rLado 3.2s ease-in-out infinite}.r-cima{animation:rCima 3.4s ease-in-out infinite}.r-ler{animation:rLer 1.6s ease-in-out infinite}
  .r-z1{animation:rZ 2.4s linear infinite}.r-z2{animation:rZ 2.4s linear 1.2s infinite}.r-v1{animation:rVapor 2s ease-out infinite}.r-v2{animation:rVapor 2s ease-out .7s infinite}
  .r-luz{animation:rLuz 1.4s ease-in-out infinite}.r-lapis{animation:rLapis 1.2s linear infinite}.r-boia{animation:rBoia 2s ease-in-out infinite}
  .r-bal{animation:rBalanca 1.2s ease-in-out infinite; transform-origin:60px 90px}.r-coch{animation:rCochilo 3s ease-in-out infinite; transform-origin:60px 90px}
  .r-n1{animation:rNota 2.2s ease-out infinite}.r-n2{animation:rNota 2.2s ease-out 1.1s infinite}.r-sobe{animation:rSobe 1.1s ease-in-out infinite}
  .r-s1{animation:rSuor 1.6s linear infinite}.r-s2{animation:rSuor 1.6s linear .8s infinite}
  .r-baba{transform-box:fill-box; transform-origin:top; animation:rBaba 2.6s ease-in-out infinite}.r-resp{transform-box:fill-box; transform-origin:center bottom; animation:rRespira 3s ease-in-out infinite}
  @keyframes rSino{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
  @keyframes rLupa{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,2px)}}
  @keyframes rConfete{0%{transform:translateY(-6px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(40px) rotate(220deg);opacity:0}}
  @keyframes rPao{0%,35%{transform:scale(0);opacity:0}50%{transform:scale(1.25);opacity:1}65%,100%{transform:scale(1);opacity:1}}
  @keyframes rAlavanca{0%,30%,100%{transform:rotate(0)}40%,60%{transform:rotate(18deg)}}
  @keyframes rFaisca{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes rMao{0%,15%{transform:translate(0,22px) rotate(-20deg)}35%,55%{transform:translate(0,0) rotate(0)}75%,100%{transform:translate(0,22px) rotate(-20deg)}}
  @keyframes rMastiga{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
  @keyframes rGrifo{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  @keyframes rCorre{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes rPernas{0%,100%{transform:skewX(18deg)}50%{transform:skewX(-18deg)}}
  @keyframes rGira{to{transform:rotate(360deg)}}
  @keyframes rPonto{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
  @keyframes rAceno{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}75%{transform:rotate(14deg)}}
  @keyframes rPalma1{0%,100%{transform:translateX(-4px)}50%{transform:translateX(1px)}}
  @keyframes rPalma2{0%,100%{transform:translateX(4px)}50%{transform:translateX(-1px)}}
  @keyframes rChama{0%,100%{transform:scale(1,1)}50%{transform:scale(.8,1.2)}}

  .r-sino{transform-box:fill-box;transform-origin:top center;animation:rSino 1s ease-in-out infinite}.r-lupa{animation:rLupa 2.4s ease-in-out infinite}
  .r-cf1{animation:rConfete 2.2s linear infinite}.r-cf2{animation:rConfete 2.2s linear .7s infinite}.r-cf3{animation:rConfete 2.2s linear 1.4s infinite}

  .r-mao{transform-box:fill-box;transform-origin:bottom left;animation:rMao 3.6s ease-in-out infinite}.r-mastiga{transform-box:fill-box;transform-origin:center;animation:rMastiga .5s ease-in-out infinite}

  .r-pernas{transform-box:fill-box;transform-origin:top center;animation:rPernas .35s linear infinite}.r-ponteiro{animation:rGira 1.2s linear infinite}
  .r-d1{animation:rPonto 1.2s ease-in-out infinite}.r-d2{animation:rPonto 1.2s ease-in-out .2s infinite}.r-d3{animation:rPonto 1.2s ease-in-out .4s infinite}
  .r-aceno{animation:rAceno .9s ease-in-out infinite}.r-palma1{animation:rPalma1 .4s ease-in-out infinite}.r-palma2{animation:rPalma2 .4s ease-in-out infinite}
  .r-chama{transform-box:fill-box;transform-origin:center bottom;animation:rChama .5s ease-in-out infinite}.r-orelha{animation:rOrelha 1.4s ease-in-out infinite}

<style>
body{font-family:Inter,Arial,sans-serif;background:#F3EFE6;color:#14211F;margin:0;padding:16px}

<h1>Reações do Psiu</h1><p class="sub">Página de teste. Cada reação aparece grande e no tamanho real do site (60 px).</p>
<div class="g" id="g"></div>
<script>
const um = l => l[0]; const futuras = () => [{prazo:'x'}]; const ehProva = () => true; const diasAte = () => 1;
  const CEREBRO = (giros = 4) => `<g fill="#F4B9C1" stroke="#A8455A" stroke-width="2.8" stroke-linejoin="round"><path d="M60 26 C52 18 38 20 36 30 C26 32 21 44 27 52 C21 60 25 72 35 74 C37 85 51 88 60 81 Z"/><path d="M60 26 C68 18 82 20 84 30 C94 32 99 44 93 52 C99 60 95 72 85 74 C83 85 69 88 60 81 Z"/></g><g fill="none" stroke="#A8455A" stroke-width="2" stroke-linecap="round"><path d="M40 36 C45 32 50 38 55 34"/><path d="M80 36 C75 32 70 38 65 34"/>${giros > 2 ? '<path d="M33 66 C36 70 40 68 41 72"/><path d="M87 66 C84 70 80 68 79 72"/>' : ''}</g>`;
  const OCULOS = (y = 58) => `<circle cx="48" cy="${y}" r="9" fill="#FFFFFF" stroke="#14211F" stroke-width="2.2"/><circle cx="72" cy="${y}" r="9" fill="#FFFFFF" stroke="#14211F" stroke-width="2.2"/><path d="M57 ${y - 1} Q60 ${y - 4} 63 ${y - 1}" fill="none" stroke="#14211F" stroke-width="2.2"/>`;
  const PUPILAS = (cls = 'psiu-olho', y = 59, dx = 0) => `<g class="${cls}"><circle cx="${48 + dx}" cy="${y}" r="2.8" fill="#14211F"/><circle cx="${72 + dx}" cy="${y}" r="2.8" fill="#14211F"/></g>`;
  const FECHADOS = (y = 59) => `<path d="M44 ${y} Q48 ${y + 3} 52 ${y} M68 ${y} Q72 ${y + 3} 76 ${y}" fill="none" stroke="#14211F" stroke-width="2.6" stroke-linecap="round"/>`;
  const FELIZES = '<path d="M44.5 60 Q48 56 51.5 60 M68.5 60 Q72 56 75.5 60" fill="none" stroke="#14211F" stroke-width="2.4" stroke-linecap="round"/>';
  const BOCA = (d = 'M53 72 Q60 76 67 72') => `<path d="${d}" fill="none" stroke="#14211F" stroke-width="2.6" stroke-linecap="round"/>`;
  const ZZZ = (x = 88, y = 34) => `<g font-family="Georgia,serif" fill="#1F5C56"><text class="r-z1" x="${x}" y="${y}" font-size="13">z</text><text class="r-z2" x="${x + 6}" y="${y - 8}" font-size="17">Z</text></g>`;

  // cada reação: desenho, duração (ms) e frases possíveis no balãozinho
  const REACOES = {
    parado:   {svg:() => CEREBRO() + OCULOS() + PUPILAS() + BOCA()},
    lado:     {svg:() => CEREBRO() + OCULOS() + PUPILAS('r-lado') + BOCA(), tempo:3400},
    pensando: {svg:() => CEREBRO() + OCULOS() + PUPILAS('r-cima') + BOCA('M55 73.5 Q61 72 66 74') + '<text class="r-boia" x="96" y="22" font-family="Georgia,serif" font-size="20" fill="#1F5C56">?</text>', tempo:3600, falas:['Hmm…', 'Deixa eu pensar…']},
    lendo:    {svg:() => CEREBRO(2) + OCULOS(54) + PUPILAS('r-ler', 57) + '<path d="M34 70 L60 66 L60 92 L34 96 Z" fill="#B7791F" stroke="#854F0B" stroke-width="2" stroke-linejoin="round"/><path d="M86 70 L60 66 L60 92 L86 96 Z" fill="#C8892C" stroke="#854F0B" stroke-width="2" stroke-linejoin="round"/><path d="M39 75 L55 72.5 M39 80 L55 77.5 M65 72.5 L81 75 M65 77.5 L81 80" stroke="#FBF1E1" stroke-width="1.6" stroke-linecap="round"/>', tempo:5000, falas:['Revisando para a prova', 'Só mais um capítulo']},
    soneca:   {svg:() => '<g class="r-coch">' + CEREBRO() + OCULOS() + FECHADOS() + '<ellipse cx="60" cy="74" rx="3" ry="2.4" fill="none" stroke="#14211F" stroke-width="2.2"/></g>' + ZZZ(), tempo:5000, falas:['zzz…']},
    cafe:     {svg:() => CEREBRO(3) + OCULOS() + FELIZES + BOCA('M54 73 Q58 76 62 73') + '<rect x="76" y="70" width="20" height="22" rx="4" fill="#FFFFFF" stroke="#14211F" stroke-width="2.2"/><path d="M96 75 Q104 76 103 82 Q102 87 96 87" fill="none" stroke="#14211F" stroke-width="2.2"/><rect x="78.5" y="74" width="15" height="4" fill="#854F0B"/><path class="r-v1" d="M82 66 Q80 62 83 58" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round"/><path class="r-v2" d="M89 66 Q87 61 90 57" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round"/>', tempo:4500, falas:['Cafezinho da aula', 'Sem café não dá']},
    ideia:    {svg:() => CEREBRO() + OCULOS() + '<circle cx="48" cy="57" r="3.4" fill="#14211F"/><circle cx="72" cy="57" r="3.4" fill="#14211F"/>' + BOCA('M50 70 Q60 82 70 70') + '<circle class="r-luz" cx="60" cy="6" r="13" fill="#FAC775"/><circle cx="60" cy="6" r="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><rect x="56" y="12" width="8" height="5" rx="1.5" fill="#888780"/>', tempo:3600, falas:['Tive uma ideia!']},
    anotando: {svg:() => CEREBRO(3) + OCULOS() + PUPILAS('', 61, 2) + '<path d="M54 74 L65 74" stroke="#14211F" stroke-width="2.6" stroke-linecap="round"/><rect x="74" y="74" width="26" height="30" rx="3" fill="#FBF1E1" stroke="#B7791F" stroke-width="1.8"/><path d="M78 82 L95 82 M78 88 L93 88 M78 94 L88 94" stroke="#B7791F" stroke-width="1.6" stroke-linecap="round"/><g class="r-lapis"><path d="M86 96 L98 80 L102 83 L90 99 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1.5" stroke-linejoin="round"/><path d="M86 96 L85 101 L90 99 Z" fill="#14211F"/></g>', tempo:4500, falas:['Anotando o prazo novo', 'Prazo novo no site!']},
    musica:   {svg:() => '<g class="r-bal">' + CEREBRO(2) + '<path d="M22 54 C22 18 98 18 98 54" fill="none" stroke="#14211F" stroke-width="4" stroke-linecap="round"/><rect x="16" y="48" width="12" height="20" rx="5" fill="#1F5C56" stroke="#14211F" stroke-width="2"/><rect x="92" y="48" width="12" height="20" rx="5" fill="#1F5C56" stroke="#14211F" stroke-width="2"/>' + OCULOS() + FELIZES + BOCA('M51 70 Q60 80 69 70') + '</g><g fill="#1F5C56" font-family="Georgia,serif" font-size="16"><text class="r-n1" x="100" y="40">♪</text><text class="r-n2" x="10" y="36">♫</text></g>', tempo:4500},
    malhando: {svg:() => '<g class="r-sobe"><path d="M30 52 L18 30 M90 52 L102 30" stroke="#1F5C56" stroke-width="4" stroke-linecap="round"/><rect x="8" y="24" width="104" height="4" rx="2" fill="#5F5E5A"/><rect x="2" y="16" width="9" height="20" rx="2" fill="#14211F"/><rect x="109" y="16" width="9" height="20" rx="2" fill="#14211F"/><rect x="11" y="19" width="5" height="14" rx="1.5" fill="#444441"/><rect x="104" y="19" width="5" height="14" rx="1.5" fill="#444441"/></g>' + CEREBRO() + OCULOS() + '<path d="M40 46 Q47 50 54 48 M66 48 Q73 50 80 46" fill="none" stroke="#14211F" stroke-width="2.6" stroke-linecap="round"/>' + PUPILAS('') + '<path d="M52 72 L68 72 L66 76 L54 76 Z" fill="#FFFFFF" stroke="#14211F" stroke-width="2.2" stroke-linejoin="round"/><path class="r-s1" d="M95 40 q3 5 0 7 q-3 -2 0 -7z" fill="#85B7EB"/><path class="r-s2" d="M24 44 q3 5 0 7 q-3 -2 0 -7z" fill="#85B7EB"/><path d="M36 84 L32 100 M84 84 L88 100" stroke="#1F5C56" stroke-width="4" stroke-linecap="round"/>', tempo:4000, falas:['Malhando os neurônios!', 'Treino de cérebro']},
    carteira: {svg:() => '<rect x="4" y="90" width="112" height="6" rx="2" fill="#B7791F" stroke="#854F0B" stroke-width="1.5"/><path d="M16 96 L16 120 M104 96 L104 120" stroke="#5F5E5A" stroke-width="4"/><g class="r-resp"><g transform="rotate(-14 60 92) translate(0 8)">' + CEREBRO() + OCULOS() + FECHADOS() + '<ellipse cx="58" cy="74" rx="4" ry="3" fill="#14211F"/><path class="r-baba" d="M55 76 Q53 84 55 92 Q58 86 57 76 Z" fill="#9FD3F0" stroke="#378ADD" stroke-width="1"/></g></g><ellipse cx="30" cy="88" rx="17" ry="6" fill="#1F5C56"/><ellipse cx="92" cy="88" rx="17" ry="6" fill="#1F5C56"/><ellipse cx="54" cy="90" rx="9" ry="1.8" fill="#9FD3F0" opacity=".9"/>' + ZZZ(), tempo:5500, falas:['Só um minutinho…', 'zzz… a aula acabou?']}
  };
